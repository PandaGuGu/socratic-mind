# 可选叠层：反向代理 + TLS + 压缩 + 安全响应头（Caddy）。
#
#   start.cmd edge                  # Windows 双击党
#   bash scripts/stack.sh up --edge  # Git Bash / WSL / Linux / macOS
#
# 什么时候需要它：
#   · 要 https:// 或域名访问（对外演示、内网共享）；
#   · 要在应用前面统一加安全头 / 压缩 / 访问日志。
# 什么时候不需要：本机开发，直接 http://localhost:8099 就够了。
#
# 端口：默认占用宿主 80/443；被别的服务占了就改 .env 里的 EDGE_HTTP_PORT / EDGE_HTTPS_PORT。
# 应用自己的 8099 仍然发布着，方便绕过代理直连排查；对外请只开 80/443。

services:
  edge:
    image: caddy:2-alpine
    container_name: psych-edge
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  caddy_data:
  caddy_config:
