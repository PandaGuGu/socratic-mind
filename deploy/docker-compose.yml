# 本地开发依赖：PostgreSQL + pgvector
# 用法：cp .env.example .env && docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: psych-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psych}
      POSTGRES_USER: ${POSTGRES_USER:-psych}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psych_local_dev}
      # 中文全文检索需要合适的排序规则，本地先用 C 排序避免索引行为差异
      LANG: C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psych} -d ${POSTGRES_DB:-psych}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
