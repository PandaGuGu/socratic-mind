# 可选叠层：把向量服务也放进容器（Ollama + BGE-M3，1024 维，免费）。
#
#   bash scripts/stack.sh up --ai
#   # 等价：docker compose -f docker-compose.yml -f docker-compose.ai.yml up -d --build
#
# 注意两点：
# 1. 首次要拉 bge-m3（约 1.2 GB）与 qwen3-8b（约 5 GB），CPU 推理会慢；
# 2. 向量维度从 256 变成 1024。新库直接建对；已有 256 维的库用
#    psych.ai.vector-migrate=true 让启动时重嵌入，或 down -v 清掉重来。

services:
  app:
    environment:
      # http 档负责装配真实模型端点，pg 档负责落库，两个都要
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-pg},http
      # 对话与向量都接容器内 Ollama；CPU 推理慢，单轮可能几十秒
      PSYCH_AI_CHAT_PROVIDER: http
      PSYCH_AI_BASE_URL: http://ollama:11434/v1
      PSYCH_AI_API_KEY: ollama
      PSYCH_AI_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3-8b}
      PSYCH_AI_NO_THINK: "true"
      PSYCH_AI_READ_TIMEOUT_SECONDS: "180"
      PSYCH_AI_EMBEDDING_PROVIDER: http
      PSYCH_AI_EMBEDDING_BASE_URL: http://ollama:11434/v1
      # Ollama 的 OpenAI 兼容端点不校验 key，但适配器要求非空
      PSYCH_AI_EMBEDDING_API_KEY: ollama
      PSYCH_AI_EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      PSYCH_AI_EMBEDDING_DIMENSION: "1024"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # 等模型拉完再启动，否则首次灌示例语料会因为找不到模型直接失败
      ollama-pull:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: psych-ollama
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-pull:
    image: ollama/ollama:latest
    container_name: psych-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c",
                 "ollama pull ${OLLAMA_EMBED_MODEL:-bge-m3} && ollama pull ${OLLAMA_CHAT_MODEL:-qwen3-8b}"]
    restart: "no"

volumes:
  ollama:
