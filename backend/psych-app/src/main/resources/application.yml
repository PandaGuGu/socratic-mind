server:
  port: 8080

spring:
  application:
    name: psych-assistant
  jackson:
    default-property-inclusion: non_null

psych:
  store: memory
  # 会话存储：memory 重启即丢（默认，开发用）；jdbc 落库，见 application-pg.yml / application-h2.yml
  session:
    store: memory
  seed:
    enabled: true
  ai:
    provider: stub
    embedding-dimension: 256
  # 内部只读控制台（/internal 与 /api/internal）。接口无鉴权，只允许本机或可信内网，
  # 对外部署时置 false。详见 docs/02-设计/内部后台.md
  internal:
    enabled: true
    auth: false
  # 输出策略文件：运维在 /internal/policy.html 改完保存即写入这里并热加载。
  # 不存在时用内置默认值；建议纳入 git，便于 review 与回滚。
  guard:
    policy-file: config/output-policy.json

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.socraticmind: INFO
    org.springframework.jdbc: WARN
