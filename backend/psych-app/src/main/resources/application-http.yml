# 真实模型档：对话走 http，向量仍是桩（DeepSeek 没有 embeddings 端点）
#
#   export PSYCH_AI_BASE_URL=https://api.deepseek.com
#   export PSYCH_AI_API_KEY=sk-...
#   export PSYCH_AI_CHAT_MODEL=deepseek-flash
#   启动加 --spring.profiles.active=http
psych:
  ai:
    provider: http
    chat-provider: http
    embedding-provider: stub
    embedding-dimension: 256
    base-url: ${PSYCH_AI_BASE_URL:}
    api-key: ${PSYCH_AI_API_KEY:}
    chat-model: ${PSYCH_AI_CHAT_MODEL:}
    embedding-model: ${PSYCH_AI_EMBEDDING_MODEL:}

logging:
  level:
    com.socraticmind: INFO
