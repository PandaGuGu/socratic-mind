# 真实模型档：对话与向量可以不同源。
#
# 对话（OpenAI 兼容）：
#   export PSYCH_AI_BASE_URL=https://api.deepseek.com
#   export PSYCH_AI_API_KEY=sk-...
#   export PSYCH_AI_CHAT_MODEL=deepseek-flash
#
# 本地 BGE-M3（Ollama，1024 维）：
#   ollama serve
#   ollama pull bge-m3
#   export PSYCH_AI_EMBEDDING_PROVIDER=http
#   export PSYCH_AI_EMBEDDING_BASE_URL=http://localhost:11434/v1
#   export PSYCH_AI_EMBEDDING_API_KEY=ollama
#   export PSYCH_AI_EMBEDDING_MODEL=bge-m3
#
# 启动加 --spring.profiles.active=http
psych:
  ai:
    provider: http
    chat-provider: ${PSYCH_AI_CHAT_PROVIDER:http}
    embedding-provider: ${PSYCH_AI_EMBEDDING_PROVIDER:http}
    embedding-dimension: ${PSYCH_AI_EMBEDDING_DIMENSION:1024}
    # 默认指向本机 Ollama；接云端时用环境变量覆盖 base-url / api-key / model
    base-url: ${PSYCH_AI_BASE_URL:http://localhost:11434/v1}
    api-key: ${PSYCH_AI_API_KEY:ollama}
    chat-model: ${PSYCH_AI_CHAT_MODEL:qwen3-8b}
    embedding-base-url: ${PSYCH_AI_EMBEDDING_BASE_URL:http://localhost:11434/v1}
    embedding-api-key: ${PSYCH_AI_EMBEDDING_API_KEY:ollama}
    embedding-model: ${PSYCH_AI_EMBEDDING_MODEL:bge-m3}
    no-think: ${PSYCH_AI_NO_THINK:true}
    temperature: ${PSYCH_AI_TEMPERATURE:0.2}
    thinking-disabled: ${PSYCH_AI_THINKING_DISABLED:false}
  # 联调档也打开控制台，方便看轨迹与拦截记录
  internal:
    enabled: true
    token: ${PSYCH_INTERNAL_TOKEN:dev-internal-token}
    dev-hint: true          # 本机验收：自动填入上面的令牌，不再弹窗

logging:
  level:
    com.socraticmind: INFO
