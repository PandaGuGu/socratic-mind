<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socratic Mind · 房间原型</title>
<style>
  :root{
    /* 黄昏，不是深夜：墙是暖灰泥，地是旧木，光从窗子斜进来。
       明暗按 60-30-10 分——六成中性暖色打底，三成赭石过渡，一成金橙做高光，
       所以整体亮起来也不会有"开了顶灯"的平。 */
    --wall:#3a2b22; --wall-dark:#241a15;
    --floor:#33251b; --floor-dark:#171110;
    --glow:#E7B57C; --mist:#F7EFE4;
    --paper:#F6EFE4; --ink:#241F1A;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",serif;
    --sans:"PingFang SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:#171110; color:var(--mist); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(232,201,160,.16); border-radius:3px;}

  .scene{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .6s ease;}
  .scene.is-active{opacity:1; pointer-events:auto;}

  #room .room{transition:transform .9s cubic-bezier(.4,0,.2,1), filter .7s ease, opacity .7s ease;}

  .wall{position:absolute;}
  .wall.back{left:16%; right:0; top:6%; bottom:30%;
    background:
      radial-gradient(30% 40% at 84% 30%, rgba(255,206,150,.26), transparent 70%),
      radial-gradient(44% 60% at 24% 62%, rgba(255,186,128,.07), transparent 72%),
      repeating-linear-gradient(91deg, rgba(255,255,255,.014) 0 2px, transparent 2px 6px),
      linear-gradient(96deg, #221913 0%, #34271e 34%, #4a3527 72%, #563d2b 100%);}
  .wall.left{left:0; width:24%; top:0; bottom:24%;
    background:linear-gradient(90deg,#150e0a 0%,#1d130e 58%,#281b14 100%);
    clip-path:polygon(0 5%,100% 11%,100% 76%,0 88%);
    box-shadow:26px 0 60px rgba(0,0,0,.32);}
  .wall.back::after{content:""; position:absolute; left:0; top:0; bottom:0; width:1px; background:rgba(230,196,154,.10);}
  .floor{position:absolute; left:0; right:0; top:70%; bottom:0;
    background:
      radial-gradient(46% 96% at 82% 0%, rgba(255,178,114,.30), transparent 62%),
      radial-gradient(40% 88% at 24% 0%, rgba(231,181,124,.14), transparent 60%),
      radial-gradient(70% 42% at 50% 0%, rgba(255,200,150,.10), transparent 74%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 1px, transparent 1px 96px),
      linear-gradient(180deg,#2c2018 0%,#221812 46%,#140e0b 100%);}
  /* 地面两端压暗：否则整条地板会变成一条发灰的横带 */
  .floor::after{content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(0,0,0,.40) 0%, rgba(0,0,0,.06) 18%, transparent 42%, transparent 76%, rgba(0,0,0,.34) 100%);}
  .skywall{position:absolute; left:0; right:0; top:0; height:7%; background:#201711;}
  /* 墙脚一圈环境遮蔽。没有它，墙与地的接缝会变成一条硬边，房间立刻变成平面插画。 */
  .skirting{position:absolute; left:0; right:0; top:calc(70% - 22px); height:22px;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.22) 58%, rgba(0,0,0,.46) 100%);
    pointer-events:none;}
  .skirting::after{content:""; position:absolute; left:16%; right:0; bottom:0; height:1px;
    background:rgba(0,0,0,.55);}
  /* 窗光落在地上的一小片。用柔光而不是梯形——梯形会变成一块玻璃板。 */
  .windowcast{position:absolute; right:0%; top:56%; width:52%; height:42%;
    background:radial-gradient(58% 62% at 62% 30%, rgba(255,190,130,.26), rgba(255,168,110,.10) 52%, transparent 78%);
    filter:blur(34px); pointer-events:none;}
  /* 唯一暖光源：落在小人脚下的光池。别的都是它的余晖。
     池子必须留在 70% 以下的地面上——一旦漫到墙上，整个房间会变成一团雾。 */
  .lightpool{position:absolute; left:5%; top:63%; width:32%; height:22%;
    background:
      radial-gradient(44% 50% at 44% 34%, rgba(255,210,158,.46), rgba(231,181,124,.16) 48%, transparent 76%);
    filter:blur(14px); transition:opacity .7s ease;}
  /* 窗的冷光只负责勾边，亮度不超过光池的一半 */
  .windowpool{position:absolute; right:0%; top:52%; width:44%; height:42%;
    background:radial-gradient(ellipse at 56% 30%, rgba(255,196,140,.16), transparent 66%); filter:blur(18px);}

  /* 落地灯：左侧那块本来是死黑，加一盏灯，暖光池才有出处。
     灯罩用上下两个圆角的梯形，比纯矩形更像布罩 */
  .lamp{position:absolute; left:1.8%; bottom:26%; width:clamp(42px,4.3vw,62px); height:clamp(150px,14.6vw,212px); pointer-events:none;}
  /* 灯罩后的光晕：单独一层，比 box-shadow 更容易控制衰减 */
  .lamp .halo{position:absolute; left:-40px; right:-40px; top:-46px; height:190px;
    background:radial-gradient(50% 50% at 50% 34%, rgba(255,196,130,.28), rgba(255,180,110,.10) 52%, transparent 76%);}
  .lamp .shade{position:absolute; left:4px; right:4px; top:0; height:40px;
    clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
    background:linear-gradient(180deg,#FFE2B8 0%,#EFC08A 48%,#C88F58 100%);
    filter:drop-shadow(0 0 26px rgba(255,196,130,.55));}
  .lamp .pole{position:absolute; left:50%; top:40px; width:2px; height:calc(100% - 54px);
    margin-left:-1px; background:linear-gradient(180deg,#5a422f,#2a1c13);}
  .lamp .base{position:absolute; left:50%; bottom:0; width:52px; height:7px; margin-left:-26px;
    border-radius:50%; background:#2e2016; box-shadow:0 6px 16px rgba(0,0,0,.5);}
  /* 地毯：只是一圈更暖的地面，不画图案，免得抢纸片 */
  .rug{position:absolute; left:14%; bottom:20%; width:26%; height:9%;
    border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,206,150,.12), rgba(255,186,128,.05) 58%, transparent 76%);}
  .figure-halo{position:absolute; left:9%; bottom:18%; width:32%; height:34%;
    background:radial-gradient(ellipse at 40% 70%, rgba(255,206,150,.24), transparent 64%); pointer-events:none;}

  .window{position:absolute; right:9%; top:15%; width:min(220px,20vw); height:min(290px,42vh); background:#2a1d2a; cursor:pointer; overflow:hidden; border:0.5px solid rgba(255,214,170,.30); box-shadow:0 0 70px rgba(255,180,120,.22), inset 0 0 40px rgba(255,190,130,.16); transition:box-shadow .5s ease, transform .55s cubic-bezier(.4,0,.2,1), opacity .45s ease;}
  .window:hover{box-shadow:0 0 96px rgba(255,196,140,.34), inset 0 0 40px rgba(255,196,140,.20);}
  .window.lit{box-shadow:0 0 110px rgba(255,206,150,.34), inset 0 0 50px rgba(255,206,150,.18);}
  .window.expand{transform:scale(9); opacity:0;}
  /* 黄昏：上紫、中橘、下金。窗里比屋里亮两档，眼睛会先落到这里 */
  .nightsky{position:absolute; inset:0;
    background:linear-gradient(180deg,#4b3f63 0%,#7d5163 28%,#b96a58 54%,#e0905f 76%,#f8c98e 100%);}
  .nightsky i{position:absolute; width:1px; height:1px; border-radius:50%; background:#FFF3DC; opacity:.30;}
  .nightsky i.new{width:3px; height:3px; background:#F0D9B4; box-shadow:0 0 10px rgba(232,201,160,.9); animation:starIn .9s ease;}
  @keyframes starIn{from{transform:scale(3); opacity:0;} to{transform:scale(1); opacity:1;}}
  /* 窗里那枚不再是月亮，是还没落尽的太阳 */
  .moon{position:absolute; right:20%; top:58%; width:26px; height:26px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #FFF6E0, #FFD79A 70%, #F7BC7C 100%);
    opacity:.95; box-shadow:0 0 26px rgba(255,220,170,.85), 0 0 70px rgba(255,190,130,.45);}
  .mv{position:absolute; left:50%; top:0; bottom:0; width:3px; margin-left:-1.5px; background:rgba(38,24,18,.82);}
  .mh{position:absolute; top:46%; left:0; right:0; height:3px; background:rgba(38,24,18,.82);}
  .sill{position:absolute; left:-6%; right:-6%; bottom:-8px; height:8px;
    background:linear-gradient(180deg,#4a3527,#33241b);}
  .wcap{position:absolute; left:0; right:0; bottom:-30px; text-align:center; font-family:var(--mono); font-size:9.5px; color:rgba(250,242,232,.46);}

  .door{position:absolute; left:6%; top:34%; width:9%; height:36%;
    background:linear-gradient(180deg,#33241a,#1e1410);
    border:0.5px solid rgba(255,214,170,.20);
    box-shadow:inset 0 0 40px rgba(0,0,0,.42), 0 0 24px rgba(255,196,140,.07); cursor:pointer;
    transition:box-shadow .45s ease, background .45s ease;}
  .door:hover{background:linear-gradient(180deg,#3f2d20,#261a13);
    box-shadow:inset 0 0 40px rgba(0,0,0,.38), 0 0 40px rgba(255,200,150,.24);}
  .door::after{content:""; position:absolute; right:7px; top:52%; width:3px; height:3px; border-radius:50%;
    background:rgba(255,214,170,.62); box-shadow:0 0 9px rgba(255,190,130,.7);}

  .figure-wrap{position:absolute; left:20%; bottom:26%; width:108px; height:132px; cursor:pointer;}
  .figure-wrap svg{width:100%; height:100%; overflow:visible; filter:drop-shadow(0 0 22px rgba(230,196,154,.22));}
  .breath{animation:breathe 6.5s ease-in-out infinite; transform-origin:50% 86%;}
  @keyframes breathe{0%,100%{transform:translateY(0) scaleY(1);} 50%{transform:translateY(-1.5px) scaleY(1.012);}}
  .glowring{opacity:.28; transition:opacity .4s ease;}
  .figure-wrap:hover .glowring{opacity:.6;}
  .figure-wrap.alert .glowring{opacity:.7; animation:pulsering 2.8s ease-in-out infinite;}
  @keyframes pulsering{0%,100%{opacity:.34;} 50%{opacity:.8;}}

  /* 只有一句主文案。第二行降两级：字号、亮度、并延后 450ms 出现，
     让眼睛先落到"它在这儿等你"，再读到怎么开始。 */
  .waiting{position:absolute; left:35%; bottom:30%; width:clamp(190px,24vw,250px); font-family:var(--serif);
    font-size:18px; color:rgba(252,245,236,.96); letter-spacing:.06em; line-height:1.7;
    transition:opacity .6s ease;}
  .waiting span{display:block; margin-top:11px; font-family:var(--sans); font-size:12.5px;
    color:rgba(252,245,236,.62); letter-spacing:.02em; line-height:1.9; opacity:0;
    animation:subIn .9s ease .45s forwards;}
  @keyframes subIn{to{opacity:1;}}
  .waiting.hidden{opacity:0;}

  /* 五颗石子保留——它是这个产品最好的一处隐喻。但把"第几步"写成字，
     石子只负责氛围，不负责传达信息。 */
  .stones{position:absolute; left:21.5%; bottom:23%; display:flex; gap:9px; align-items:flex-end;}
  .stones span{width:11px; height:6px; border-radius:50%; background:rgba(252,245,236,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06); transition:background .5s ease, box-shadow .5s ease;}
  .stones span.on{background:var(--glow); box-shadow:0 0 14px rgba(230,196,154,.55);}
  .stones .cap{position:absolute; left:0; top:13px; font-family:var(--mono); font-size:10px;
    letter-spacing:.1em; color:rgba(252,245,236,.60); white-space:nowrap;}

  .slip{position:absolute; right:5%; bottom:5%; width:min(460px,52vw); background:var(--paper); color:var(--ink); padding:20px 24px 16px; border-radius:2px; box-shadow:0 26px 70px rgba(24,10,4,.42); font-family:var(--serif); transition:opacity .5s ease, transform .5s cubic-bezier(.4,0,.2,1);}
  .slip.hidden{opacity:0; transform:translateY(26px); pointer-events:none;}
  .slip .meta{font-family:var(--sans); font-size:10px; letter-spacing:.08em; color:rgba(36,31,26,.45); margin-bottom:9px;}
  .slip .q{font-size:15.5px; line-height:1.9; margin-bottom:14px;}
  .slip .q sup{font-family:var(--mono); font-size:9px; color:#A9673A; margin-left:2px;}
  .slip .opts{display:flex; gap:18px; font-family:var(--sans); font-size:12.5px; margin-bottom:14px; flex-wrap:wrap;}
  .slip .opts button{background:none; border:none; padding:0 0 2px; color:rgba(36,31,26,.62); border-bottom:0.5px solid rgba(36,31,26,.25); cursor:pointer; font-family:var(--sans); font-size:12.5px;}
  .slip .opts button:hover{color:var(--ink); border-bottom-color:#A9673A;}
  .slip .line{display:flex; gap:12px; align-items:center; border-top:0.5px solid rgba(36,31,26,.14); padding-top:12px;}
  .slip .field{flex:1; font-size:13px; color:rgba(36,31,26,.40); font-family:var(--sans);}
  .slip .send{background:var(--ink); color:var(--paper); border:none; border-radius:2px; padding:8px 18px; font-size:12px; font-family:var(--sans); cursor:pointer;}

  .flying{position:fixed; width:34px; height:24px; z-index:60; pointer-events:none; background:var(--paper); border-radius:1px; box-shadow:0 0 24px rgba(232,201,160,.70);}

  .toast{position:absolute; left:50%; bottom:13%; transform:translateX(-50%); font-family:var(--serif); font-size:13px; color:rgba(237,232,222,.55); opacity:0; transition:opacity .8s ease; pointer-events:none;}
  .toast.show{opacity:1;}

  .vignette{position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 210px 30px rgba(26,14,9,.30), inset 0 -70px 120px -50px rgba(0,0,0,.34);}

  #outside{background:#0B0A10;}
  .stars{position:absolute; inset:0; pointer-events:none;}
  .stars i{position:absolute; width:1.5px; height:1.5px; border-radius:50%; background:#EDE8DE; opacity:.3;}
  svg.threads{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  svg.threads path{fill:none; stroke:rgba(232,201,160,.16); stroke-width:1;}

  .outside-head{position:absolute; left:8%; top:8%;}
  .outside-head h1{font-family:var(--serif); font-size:15px; font-weight:500; color:rgba(237,232,222,.72); letter-spacing:.06em;}
  .outside-head p{font-family:var(--mono); font-size:9.5px; color:rgba(237,232,222,.30); margin-top:7px; letter-spacing:.08em;}

  .bubble{position:absolute; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transform:translate(-50%,-50%); transition:filter .3s ease; animation:float 9s ease-in-out infinite;}
  .bubble::before{content:""; position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 38% 32%, rgba(232,201,160,.52), rgba(232,201,160,.14) 62%, transparent 74%);}
  .bubble::after{content:""; position:absolute; inset:0; border-radius:50%; border:0.5px solid rgba(232,201,160,.50); box-shadow:0 0 44px rgba(232,201,160,.20), inset 0 0 30px rgba(232,201,160,.12);}
  .bubble:hover{filter:brightness(1.45);}
  .bubble.live::after{border-color:rgba(232,201,160,.60); animation:pulsering 3.6s ease-in-out infinite;}
  .bubble .inner{width:32%; height:32%; border-radius:50%; background:radial-gradient(circle, rgba(232,201,160,.55), transparent 70%); opacity:.6;}
  .bubble .lbl{position:absolute; top:calc(100% + 11px); left:50%; transform:translateX(-50%); font-family:var(--serif); font-size:12.5px; color:rgba(237,232,222,.70); white-space:nowrap;}
  .bubble .age{position:absolute; top:calc(100% + 29px); left:50%; transform:translateX(-50%); font-family:var(--mono); font-size:9.5px; color:rgba(237,232,222,.32); white-space:nowrap;}
  .bubble.empty::before{background:radial-gradient(circle at 50% 50%, rgba(232,201,160,.04), transparent 70%);}
  .bubble.empty::after{border-style:dashed; border-color:rgba(232,201,160,.18); box-shadow:none;}
  @keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0);} 50%{transform:translate(-50%,-50%) translateY(-7px);}}

  .backbtn{position:absolute; left:26px; top:24px; width:34px; height:34px; border-radius:50%; border:0.5px solid rgba(232,201,160,.20); background:rgba(12,11,16,.4); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:20; color:rgba(237,232,222,.6); font-size:13px; text-decoration:none; line-height:1;}
  .reader-acts{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .linkbtn{padding:0; border:0; background:none; cursor:pointer; font-family:var(--sans);
    font-size:11px; color:rgba(36,31,26,.42); text-decoration:underline; text-underline-offset:3px;}
  .linkbtn:hover{color:rgba(36,31,26,.78);}
  .linkbtn[hidden]{display:none;}
  .shareurl{width:100%; margin-top:8px; padding:6px 8px; border:0.5px solid rgba(36,31,26,.16);
    background:rgba(255,255,255,.5); font-family:var(--mono); font-size:10.5px; color:rgba(36,31,26,.7);}
  .backbtn:hover{border-color:rgba(232,201,160,.5); color:var(--mist);}
  .backbtn svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round;}

  /* 窗外：翻页与跨会话趋势。都不抢泡泡的注意力，只在底部各占一小块。 */
  .morebtn{position:absolute; right:7%; bottom:9%; z-index:5; padding:7px 13px; cursor:pointer;
    border:0.5px solid rgba(232,201,160,.22); border-radius:16px; background:rgba(12,11,16,.45);
    font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:rgba(237,232,222,.55);}
  .morebtn:hover{border-color:rgba(232,201,160,.55); color:rgba(237,232,222,.86);}
  .morebtn[hidden]{display:none;}

  .trend{position:absolute; left:8%; bottom:8%; z-index:5; width:min(300px,58vw);
    opacity:0; transition:opacity .7s ease; pointer-events:none;}
  .trend.on{opacity:1;}
  .trend .cap{display:flex; justify-content:space-between; gap:12px;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:rgba(237,232,222,.34);}
  .trend svg{display:block; width:100%; height:54px; margin-top:9px; overflow:visible;}
  .trend svg .base{stroke:rgba(232,201,160,.12); stroke-width:1;}
  .trend svg .line{fill:none; stroke:rgba(232,201,160,.55); stroke-width:1.2;}
  .trend svg .dot{fill:#E8C9A0; opacity:.8;}

  /* 账号入口：房间不贴标签，只用一个小点表示"这枚令牌已经是账号" */
  .acctbtn{position:absolute; right:26px; top:24px; z-index:20; display:flex; align-items:center; gap:6px;
    padding:0 11px; height:28px; border-radius:14px; border:0.5px solid rgba(232,201,160,.18);
    background:rgba(12,11,16,.4); color:rgba(237,232,222,.50); font-family:var(--mono);
    font-size:9.5px; letter-spacing:.08em; text-decoration:none;}
  .acctbtn:hover{border-color:rgba(232,201,160,.5); color:var(--mist);}
  .acctbtn.on{color:rgba(237,232,222,.74);}
  .acctbtn.on::before{content:""; width:4px; height:4px; border-radius:50%; background:#E8C9A0; box-shadow:0 0 8px rgba(232,201,160,.7);}

  .reader{position:absolute; inset:0; background:rgba(8,7,11,.72); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .4s ease; z-index:30;}
  .reader.open{opacity:1; pointer-events:auto;}
  .reader-slip{width:min(440px,84vw); max-height:72vh; overflow-y:auto; background:var(--paper); color:var(--ink); padding:26px 28px 22px; border-radius:2px; box-shadow:0 30px 80px rgba(0,0,0,.6); font-family:var(--serif);}
  .reader-slip .when{font-family:var(--mono); font-size:10px; color:rgba(36,31,26,.42); letter-spacing:.06em; margin-bottom:14px;}
  .reader-slip .line-row{margin-bottom:13px; font-size:13.5px; line-height:1.85;}
  .reader-slip .line-row.you{color:rgba(36,31,26,.72); padding-left:12px; border-left:0.5px solid rgba(36,31,26,.22);}
  .reader-slip .cite{margin-top:16px; border-left:2px solid #A9673A; padding-left:11px; font-size:10.5px; line-height:1.7; color:rgba(36,31,26,.55);}
  .reader-slip .close{margin-top:18px; font-family:var(--sans); font-size:12px; color:rgba(36,31,26,.5); cursor:pointer; border:none; background:none; border-bottom:0.5px solid rgba(36,31,26,.3); padding-bottom:2px;}

  .slip .q{white-space:pre-wrap;}
  .slip .line input{
    flex:1; border:none; background:none; outline:none;
    font-family:var(--sans); font-size:13px; color:var(--ink);
  }
  .slip .line input::placeholder{color:rgba(36,31,26,.40);}
  .slip .line.is-off{opacity:.45; pointer-events:none;}
  .confirm{display:none; border-top:0.5px solid rgba(36,31,26,.14); margin-top:12px; padding-top:12px;}
  .confirm.on{display:block;}
  .confirm .txt{font-family:var(--sans); font-size:11.5px; color:rgba(36,31,26,.55); margin-bottom:9px; line-height:1.7;}
  .confirm .btns{display:flex; gap:10px;}
  .confirm button{
    font-family:var(--sans); font-size:12px; cursor:pointer; border-radius:2px; padding:7px 14px;
    border:0.5px solid rgba(36,31,26,.28); background:none; color:rgba(36,31,26,.72);
  }
  .confirm button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .confirm button:disabled{opacity:.4; cursor:default;}

  /* 窄屏：小人和文案会撞在一起，文案让开；窗子放大一点，不然只是个小方块 */
  @media (max-width: 760px){
    .waiting{left:47%; bottom:31%; width:min(190px,46vw); font-size:16px;}
    .window{width:min(180px,32vw); height:min(240px,38vh);}
    .stones{left:22%; bottom:22%;}
  }

  body.is-safety .lightpool, body.is-safety .figure-halo{opacity:.22;}
  body.is-safety .window{filter:grayscale(.55) brightness(.82);}

  /* 语音：只在浏览器里转文字，不录、不传、不留 */
  .slip .line .mic{
    width:30px; height:30px; flex:0 0 30px; border-radius:50%; cursor:pointer;
    border:0.5px solid rgba(36,31,26,.26); background:none; color:rgba(36,31,26,.62);
    display:flex; align-items:center; justify-content:center;
  }
  .slip .line .mic svg{width:15px; height:15px; fill:none; stroke:currentColor;
    stroke-width:1.6; stroke-linecap:round;}
  .slip .line .mic:hover{border-color:rgba(169,103,58,.6); color:var(--ink);}
  .slip .line .mic.on{background:var(--ink); color:var(--paper); border-color:var(--ink); animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  /* 偏差提示：只在这一轮出现，不写进记录、不带评判 */
  .hint{display:none; margin-top:9px; font-family:var(--sans); font-size:11px; line-height:1.7; color:rgba(36,31,26,.52);}
  .hint.on{display:block;}
  .hint b{font-weight:500; color:rgba(36,31,26,.72);}

  /* 情绪刻度 */
  .mood{display:none; margin-top:12px; padding-top:10px; border-top:0.5px solid rgba(36,31,26,.10);}
  .mood.on{display:block;}
  .mood .cap{font-family:var(--sans); font-size:10.5px; color:rgba(36,31,26,.44); margin-bottom:7px;}
  .scale{display:flex; gap:3px;}
  .scale button{
    flex:1; min-width:0; height:22px; cursor:pointer; border:0; border-radius:2px;
    font-family:var(--mono); font-size:9.5px; color:rgba(36,31,26,.52);
    background:rgba(36,31,26,.05);
  }
  .scale button:hover{background:rgba(36,31,26,.12);}
  .scale button.on{background:var(--ink); color:var(--paper);}
  .scale button.low{background:rgba(160,70,55,.16);}
  .curve{display:block; width:100%; height:34px; margin-top:6px; opacity:.85;}

  /* 危机卡片：暂停时才出现 */
  .crisis{display:none; margin-top:12px; padding:13px 14px; border:0.5px solid rgba(150,70,55,.35); background:rgba(150,70,55,.05);}
  .crisis.on{display:block;}
  .crisis h4{font-family:var(--serif); font-size:13.5px; font-weight:400; color:var(--ink); margin-bottom:8px;}
  .crisis .num{font-family:var(--mono); font-size:11.5px; line-height:1.9; color:rgba(36,31,26,.78); white-space:pre-wrap;}
  .crisis .who{margin-top:9px; font-family:var(--sans); font-size:11.5px; color:rgba(36,31,26,.62); line-height:1.8;}
  .crisis .who-acts{display:flex; gap:12px; align-items:center; margin-top:5px; font-size:11px;}
  .crisis .who-acts a{color:rgba(150,70,55,.9); text-decoration:underline; text-underline-offset:3px;}
  .crisis .who-acts span{color:rgba(36,31,26,.4); font-size:10.5px;}
  .crisis .notice{
    width:100%; height:76px; margin-top:9px; padding:8px; resize:none; display:none;
    border:0.5px solid rgba(36,31,26,.18); background:rgba(255,255,255,.45);
    font-family:var(--serif); font-size:11px; line-height:1.7; color:rgba(36,31,26,.75);
  }
  .crisis .notice.on{display:block;}
  .crisis .btns{display:flex; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .crisis .btns button{
    font-family:var(--sans); font-size:11.5px; cursor:pointer; padding:6px 11px; border-radius:2px;
    border:0.5px solid rgba(36,31,26,.26); background:none; color:rgba(36,31,26,.7);
  }
  .crisis .btns button.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .crisis .form{display:none; margin-top:10px; gap:6px; flex-wrap:wrap;}
  .crisis .form.on{display:flex;}
  .crisis .form input{
    flex:1; min-width:80px; padding:6px 8px; font-family:var(--sans); font-size:11.5px;
    border:0.5px solid rgba(36,31,26,.2); background:rgba(255,255,255,.45); color:var(--ink); outline:none;
  }
  .crisis .form input::placeholder{color:rgba(36,31,26,.35);}
  /* 状态字不再常驻画面：连上了就当它不存在，断线才出现。 */
  .conn{position:absolute; left:26px; bottom:24px; font-family:var(--mono); font-size:9.5px;
    color:rgba(237,232,222,.30); letter-spacing:.06em; opacity:0; pointer-events:none;
    transition:opacity .3s ease;}
  .conn.bad{opacity:1; color:#C4675C;}

  /* ---------- 门外：没有步骤的直接对聊 ----------
     画面是"蓝调时刻"而不是深夜：天顶仍暗，近地平线转冷青，最后一格是月出前的暖光。
     层次靠换色号做（远山偏蓝、近山压深），不靠半透明叠黑——叠黑会脏，
     这是山水式分层的通用做法，和 clip-path 折线的点位配合使用。 */
  #world{
    /* 极光与雾用了负的 left/right 来消除接缝，必须裁掉，否则页面会横向溢出 */
    overflow:hidden;
    background:
      radial-gradient(120% 74% at 50% 104%, rgba(255,196,138,.20), rgba(255,196,138,.05) 30%, transparent 58%),
      linear-gradient(180deg,
        #05080f 0%, #081228 14%, #0e2038 30%, #143350 46%,
        #1a4a60 60%, #22566a 72%, #31505a 82%, #464543 90%, #4e463c 96%, #443c33 100%);
  }

  /* 极光：两条稀薄的带状光，只动 transform（不动 filter），避免整屏重绘 */
  .waurora{position:absolute; left:-12%; right:-12%; top:-10%; height:68%;
    pointer-events:none; filter:blur(34px); opacity:.66; will-change:transform;}
  .waurora.a{
    background:
      radial-gradient(56% 44% at 24% 42%, rgba(64,206,178,.40), transparent 66%),
      radial-gradient(48% 38% at 60% 30%, rgba(96,126,224,.32), transparent 70%),
      radial-gradient(42% 38% at 84% 46%, rgba(152,104,216,.26), transparent 72%);
    animation:auroraA 38s ease-in-out infinite alternate;}
  .waurora.b{top:0; height:50%; opacity:.30; filter:blur(50px);
    background:
      radial-gradient(50% 40% at 44% 62%, rgba(104,208,192,.30), transparent 70%),
      radial-gradient(44% 36% at 78% 42%, rgba(126,100,206,.24), transparent 72%);
    animation:auroraB 52s ease-in-out infinite alternate;}
  @keyframes auroraA{
    from{transform:translate3d(-3%,0,0) skewY(-1.6deg);}
    to{transform:translate3d(4%,-2%,0) skewY(1.4deg);}}
  @keyframes auroraB{
    from{transform:translate3d(3%,1%,0) skewY(1deg);}
    to{transform:translate3d(-4%,-1%,0) skewY(-1.2deg);}}

  .wstars{position:absolute; inset:0; pointer-events:none;}
  .wstars i{position:absolute; border-radius:50%; background:#F2EEE4;
    box-shadow:0 0 6px rgba(226,238,255,.55); animation:twinkle 6s ease-in-out infinite;}

  /* 月亮：本体 + 两圈晕。晕用径向渐变而不是 box-shadow，边缘更干净 */
  .wmoon{position:absolute; right:15%; top:13%; width:76px; height:76px; border-radius:50%;
    pointer-events:none;
    background:radial-gradient(circle at 38% 32%, #fffdf6 0%, #f7ebd2 46%, #e6d0aa 76%, #cfb083 100%);
    box-shadow:0 0 26px 6px rgba(255,241,214,.42),
               0 0 90px 34px rgba(255,224,175,.20),
               0 0 200px 90px rgba(255,206,150,.10);}
  .wmoon::after{content:""; position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(26% 20% at 62% 34%, rgba(206,182,146,.32), transparent 70%),
      radial-gradient(18% 16% at 38% 62%, rgba(206,182,146,.26), transparent 70%),
      radial-gradient(12% 12% at 54% 74%, rgba(206,182,146,.20), transparent 70%);}

  /* 三层山：远山最亮最蓝，近山压到近黑，中间一层过渡。百分比单位，缩放不变形 */
  .wfar, .wmid, .wnear{position:absolute; left:-2%; right:-2%; pointer-events:none;}
  .wfar{bottom:23%; height:32%; background:linear-gradient(180deg,#4c7089,#35566f);
    clip-path:polygon(0 100%,0 74%,9% 58%,17% 66%,26% 44%,34% 58%,43% 40%,52% 60%,
      61% 48%,70% 66%,79% 50%,88% 62%,96% 54%,100% 60%,100% 100%);}
  .wmid{bottom:13%; height:29%; background:linear-gradient(180deg,#284a63,#1a3247);
    clip-path:polygon(0 100%,0 78%,7% 62%,15% 74%,24% 52%,33% 70%,42% 56%,52% 76%,
      62% 60%,71% 74%,80% 58%,89% 72%,97% 64%,100% 70%,100% 100%);}
  .wnear{bottom:0; height:31%; background:linear-gradient(180deg,#0d1b2b,#060d18 72%);
    clip-path:polygon(0 100%,0 86%,10% 70%,19% 82%,29% 64%,39% 80%,49% 68%,59% 84%,
      69% 72%,79% 86%,89% 74%,100% 84%,100% 100%);}

  /* 地平线上的一线余晖：一条细的暖光，不是一整块色带——
     色带会变成"沙滩"，一条线才像远处的城镇或还没落尽的太阳。 */
  /* 谷底压暗：没有这一层，山与山之间的天光会连成一条灰带，像铺了一块板 */
  .wground{position:absolute; left:0; right:0; bottom:0; height:38%; pointer-events:none;
    background:linear-gradient(180deg, rgba(9,18,30,0) 0%, rgba(8,16,27,.55) 42%, rgba(4,9,16,.92) 100%);}
  .whaze{position:absolute; left:0; right:0; bottom:26%; height:7%; pointer-events:none;
    background:radial-gradient(72% 62% at 50% 54%, rgba(255,198,142,.20), transparent 76%);}

  /* 两层雾：一层贴着山脚，一层飘在半山。缓慢平移，只做线性渐变 */
  .wfog{position:absolute; left:-8%; right:-8%; pointer-events:none;}
  .wfog.a{bottom:13%; height:20%;
    background:radial-gradient(62% 54% at 46% 52%, rgba(206,224,236,.22), transparent 74%);
    animation:fogA 64s linear infinite alternate;}
  .wfog.b{bottom:24%; height:14%; opacity:.75;
    background:radial-gradient(58% 50% at 62% 50%, rgba(180,206,226,.16), transparent 76%);
    animation:fogB 88s linear infinite alternate;}
  @keyframes fogA{from{transform:translateX(-3%);} to{transform:translateX(3%);}}
  @keyframes fogB{from{transform:translateX(2.5%);} to{transform:translateX(-2.5%);}}

  /* 萤火：地面附近的小暖点，不用图片 */
  .wfire{position:absolute; inset:0; pointer-events:none;}
  .wfire i{position:absolute; width:3px; height:3px; border-radius:50%;
    background:#FFE2AE; box-shadow:0 0 8px 2px rgba(255,214,150,.55);
    animation:drift 14s ease-in-out infinite;}
  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0); opacity:.0;}
    16%{opacity:.85;}
    50%{transform:translate3d(14px,-22px,0); opacity:.55;}
    82%{opacity:.75;}
  }
  @keyframes twinkle{0%,100%{opacity:.30;} 50%{opacity:.95;}}

  /* 对话区后面的一层薄纱：让文字从山水里"浮起来"，而不是压在山脊上 */
  /* 月光落在山脊上：只加在右上，画面立刻有方向感，不再像一张平铺的渐变 */
  .wmooncast{position:absolute; right:-6%; top:2%; width:62%; height:78%; pointer-events:none;
    background:radial-gradient(48% 46% at 74% 34%, rgba(255,228,186,.13), rgba(255,214,160,.05) 54%, transparent 76%);
    mix-blend-mode:screen;}
  /* 轻暗角：把视线收到中间。半径给大，才不会又把画面压回黑夜 */
  .wvig{position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 300px 0 rgba(3,7,14,.20);}
  .wveil{position:absolute; left:50%; top:8%; bottom:78px; transform:translateX(-50%);
    width:min(780px,96vw); pointer-events:none;
    background:radial-gradient(58% 56% at 50% 52%, rgba(4,10,20,.52), rgba(4,10,20,.24) 56%, transparent 78%);}

  .whead{position:absolute; left:8%; top:8%; z-index:5;}
  .whead h1{font-family:var(--serif); font-size:15px; font-weight:500; color:rgba(245,238,226,.86);
    letter-spacing:.06em; text-shadow:0 1px 14px rgba(2,6,14,.7);}
  .whead p{font-family:var(--mono); font-size:9.5px; color:rgba(238,232,222,.46); margin-top:7px;
    letter-spacing:.08em; text-shadow:0 1px 12px rgba(2,6,14,.7);}

  .wback{position:absolute; left:26px; top:24px; z-index:20; display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:rgba(240,234,224,.58);
    text-shadow:0 1px 12px rgba(2,6,14,.8); cursor:pointer; text-decoration:none;}
  .wback:hover{color:rgba(255,250,240,.94);}
  .wlog{position:absolute; left:50%; top:17%; bottom:104px; transform:translateX(-50%);
    width:min(620px,86vw); overflow-y:auto; display:flex; flex-direction:column; justify-content:flex-end; gap:15px;
    padding:6px 2px 20px; scrollbar-width:thin;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 22px, #000 calc(100% - 26px), transparent);
    mask-image:linear-gradient(180deg, transparent 0, #000 22px, #000 calc(100% - 26px), transparent);}
  .wlog::-webkit-scrollbar{width:5px;}
  .wlog::-webkit-scrollbar-thumb{background:rgba(232,201,160,.14); border-radius:3px;}
  .wmsg{max-width:84%; font-size:13.5px; line-height:1.9; white-space:pre-wrap; word-break:break-word;
    animation:wfade .45s ease both;}
  .wmsg.her{align-self:flex-start; font-family:var(--serif); font-size:14.5px; line-height:1.95;
    color:rgba(248,243,233,.95); text-shadow:0 1px 16px rgba(3,8,16,.75);}
  .wmsg.me{align-self:flex-end; font-family:var(--sans); color:rgba(255,250,240,.97);
    padding:8px 13px; border-radius:10px 10px 2px 10px;
    background:linear-gradient(180deg, rgba(255,226,178,.22), rgba(255,206,150,.13));
    border:0.5px solid rgba(255,226,178,.32);
    box-shadow:0 10px 26px -16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.10);}
  .wmsg.pending{opacity:.38;}
  @keyframes wfade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .wbar{position:absolute; left:50%; bottom:30px; transform:translateX(-50%);
    width:min(620px,86vw); display:flex; gap:8px; z-index:6;}
  .wbar input{flex:1; min-width:0; padding:11px 14px; border-radius:3px;
    border:0.5px solid rgba(255,226,178,.30); background:rgba(10,18,32,.50);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    color:var(--mist); font-family:var(--sans); font-size:13px; outline:none;
    box-shadow:0 14px 34px -22px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.07);}
  .wbar input:focus{border-color:rgba(255,226,178,.64); background:rgba(10,18,32,.74);}
  .wbar input::placeholder{color:rgba(237,232,222,.34);}
  .wbar button{padding:0 22px; border-radius:3px; cursor:pointer; font-family:var(--sans); font-size:12.5px;
    border:1px solid rgba(255,232,196,.5); color:#2a1f12;
    background:linear-gradient(180deg,#ffe3b6,#eabf8b);
    box-shadow:0 12px 28px -16px rgba(255,206,150,.75);}
  .wbar button:hover{filter:brightness(1.06);}
  .wbar button:disabled{opacity:.4; cursor:default;}
  .wbar .wmic{flex:0 0 42px; width:42px; padding:0; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:0.5px solid rgba(255,226,178,.34); background:rgba(10,18,32,.50);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    color:rgba(255,240,220,.82); box-shadow:0 12px 28px -20px rgba(0,0,0,.8);}
  .wbar .wmic svg{width:17px; height:17px; fill:none; stroke:currentColor;
    stroke-width:1.6; stroke-linecap:round;}
  .wbar .wmic:hover{border-color:rgba(255,226,178,.66); color:#fff6e8;}
  .wbar .wmic.on{background:linear-gradient(180deg,#ffe3b6,#eabf8b); border-color:rgba(255,232,196,.7);
    color:#3a2716; animation:pulse 1.4s ease-in-out infinite;}
  .wbar .wmic[disabled]{opacity:.4; cursor:default;}
  /* 危机卡片在门外是"黑夜里的一张纸"：沿用屋里的样式，只换底色。
     它随对话流排布，是这一轮的结尾，不是浮在记录上的弹窗。 */
  .wcrisis{align-self:stretch; margin:2px 0 0; padding:14px 15px; border-radius:3px;
    background:var(--paper); box-shadow:0 18px 44px -24px rgba(0,0,0,.6);}
  .wcrisis.on{display:block;}
  .wtoast{position:absolute; left:50%; bottom:82px; transform:translateX(-50%);
    font-family:var(--serif); font-size:12.5px; color:rgba(248,242,232,.72);
    text-shadow:0 1px 14px rgba(2,6,14,.85);
    opacity:0; transition:opacity .6s ease; pointer-events:none; z-index:7;}
  .wtoast.show{opacity:1;}

  /* 画面在动，但不必让所有人都动：系统设了"减少动态效果"就全部停住 */
  @media (prefers-reduced-motion: reduce){
    .waurora, .wfog, .wfire i, .wstars i{animation:none !important;}
  }
</style>
</head>
<body>

<section class="scene is-active" id="room">
  <div class="room">
    <a class="backbtn" href="/knowledge/" aria-label="返回知识主页" title="返回知识主页">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M12 4.5 6.5 10 12 15.5"></path>
      </svg>
    </a>
    <a class="acctbtn" id="acctBtn" href="/account/" title="账号：登录后换设备也能看到记录">账号</a>
    <div class="skywall"></div>
    <div class="wall left"></div>
    <div class="wall back"></div>
    <div class="floor"></div>
    <div class="rug"></div>
    <div class="lightpool"></div>
    <div class="windowpool"></div>
    <div class="windowcast"></div>

    <div class="figure-halo"></div>

    <div class="door" id="door" title="结束这一轮"></div>

    <div class="lamp" aria-hidden="true">

      <div class="cap" id="stoneCap">还没开始</div>
    </div>

    <div class="figure-wrap" id="figure">
      <svg viewBox="0 0 120 150" aria-label="坐在墙角盘腿的人">
        <ellipse class="glowring" cx="60" cy="142" rx="44" ry="9" fill="rgba(232,201,160,.20)"/>
        <ellipse cx="60" cy="139" rx="40" ry="8" fill="#3B3029"/>
        <ellipse cx="60" cy="137" rx="40" ry="7" fill="#4A3C32"/>
        <g class="breath">
          <path d="M28 132 C34 119 47 115 60 115 C73 115 86 119 92 132 C86 139 34 139 28 132Z" fill="#151219"/>
          <path d="M51 116 C46 103 47 89 53 83 L67 83 C73 89 74 103 69 116Z" fill="#17141B"/>
          <circle cx="60" cy="66" r="17" fill="#1A1720"/>
          <path d="M28 132 C34 119 47 115 60 115 C73 115 86 119 92 132" fill="none" stroke="rgba(230,196,154,.62)" stroke-width="1"/>
          <path d="M69 116 C74 103 73 89 67 83" fill="none" stroke="rgba(230,196,154,.70)" stroke-width="1"/>
          <path d="M77 66 A17 17 0 0 1 60 83" fill="none" stroke="rgba(230,196,154,.82)" stroke-width="1"/>
          <path d="M53 88 C45 96 43 108 47 118" fill="none" stroke="rgba(230,196,154,.26)" stroke-width="1"/>
          <path d="M40 121 C50 125 70 125 80 121" fill="none" stroke="rgba(230,196,154,.20)" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <div class="waiting" id="waiting">它在这儿等你。<span>点它一下，或者直接说想说的。</span></div>

    <div class="slip hidden" id="slip">
      <div class="meta" id="slipMeta">第 1 步 · 情境</div>
      <div class="q" id="slipQ">最近有什么事，一直搁在心里？</div>
      <div class="opts" id="slipOpts">
        <button data-answer="下周要组会汇报，一想到就手心出汗">下周要组会汇报</button>

<script>
const API = "/api/cbt/sessions";
const PARAMS = new URLSearchParams(location.search);
const DEMO = PARAMS.get("demo");
const VIEW = PARAMS.get("view");
const $ = (id) => document.getElementById(id);
const STAGES = ["情境", "想法", "检验", "行动", "复盘"];

const S = {
  id: localStorage.getItem("sm-session") || null,
  token: localStorage.getItem("sm-token") || null,
  stage: null,
  status: null,
  awaiting: false,
  editing: false,
  safety: false,
  turns: 0,
  busy: false,
  visibleIndex: 0,
  rows: [],
  cursor: null,
  hasMore: false
};

const room = $("room"), outside = $("outside");
const slip = $("slip"), waiting = $("waiting"), toast = $("toast");
const nightsky = $("nightsky"), win = $("window"), figure = $("figure");
const field = $("field"), sendBtn = $("send"), confirmRow = $("confirmRow");

function showScene(el) {
  [room, outside, $("world")].forEach((s) => {
    if (s) s.classList.toggle("is-active", s === el);
  });
}

function say(text, ms) {
  toast.textContent = text;
  toast.classList.add("show");
  // 门外是另一个场景，屋里那条 toast 已经看不见了，同一条话也要落到外面
  const outsideToast = $("wToast");
  if (outsideToast) {
    outsideToast.textContent = text;
    outsideToast.classList.add("show");
  }
  clearTimeout(say._t);
  say._t = setTimeout(() => {
    toast.classList.remove("show");
    if (outsideToast) outsideToast.classList.remove("show");
  }, ms || 2200);
}

function setConn(text, bad) {
  const el = $("conn");
  el.textContent = text;
  el.classList.toggle("bad", Boolean(bad));
}

/**
 * 所有请求都带上身份令牌：令牌由服务端在该设备第一次开口时签发，
 * 只存在本机。没有它，别人的会话对你来说就是"不存在"。
 */
async function api(path, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, opts.headers || {});
  if (S.token) opts.headers["X-User-Token"] = S.token;

  const res = await fetch(API + path, opts);
  const fresh = res.headers.get("X-User-Token");
  if (fresh) {
    S.token = fresh;
    localStorage.setItem("sm-token", fresh);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.message || data.error || ("请求失败 " + res.status));
  }
  return data;
}

function jsonBody(obj) {
  return {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(obj)
  };
}

/* ---------- 纸片与进度 ---------- */

function paintStones() {
  const idx = S.turns === 0 || S.stage === "SAFETY_HOLD" || S.status === "ended" ? -1 : (S.visibleIndex ?? 0);
  document.querySelectorAll("#stones span").forEach((s, i) => s.classList.toggle("on", i === idx));
  $("stoneCap").textContent = S.safety
    ? "已暂停"
    : S.turns === 0
      ? "还没开始"
      : "0" + (idx + 1) + " / 05 · " + STAGES[idx];
}

function metaOf(t) {
  if (t.stage === "SAFETY_HOLD") return "安全暂停";
  if (t.status === "ended") return "这一轮结束";
  const n = Math.min(5, Math.max(1, (t.visibleIndex ?? 0) + 1));
  return "第 " + n + " 步 · " + (t.stageLabel || "");
}

function applyTurn(t, isStart) {
  S.id = t.sessionId;
  localStorage.setItem("sm-session", t.sessionId);
  S.stage = t.stage;
  S.status = t.status;
  S.awaiting = Boolean(t.awaitingConfirmation);
  S.safety = t.stage === "SAFETY_HOLD";
  S.visibleIndex = t.visibleIndex;
  if (!isStart) S.turns++;

  document.body.classList.toggle("is-safety", S.safety);
  if (S.safety) {
    const breath = document.querySelector(".breath");
    if (breath) breath.style.animation = "none";
    figure.classList.add("alert");
  }

  paintStones();
  showSlip(t, isStart);
  setConn(S.safety ? "已暂停 · 不会追问" : "连着 · 第 " + Object.keys(STAGES).length + " 步流程");
}

function showSlip(t, isStart) {
  waiting.classList.add("hidden");
  slip.classList.remove("hidden");

  $("slipMeta").textContent = metaOf(t);
  $("slipQ").textContent = t.response || "";
  $("slipOpts").innerHTML = "";

  const ended = t.status === "ended";
  // 不要在这里看 S.busy：showSlip 是在 await 之后、finally 置回 false 之前被调用的，
  // 一旦把 busy 算进来，输入行会带着 is-off 留下来（pointer-events:none），
  // 用户答完第一句就再也点不动输入框——"说了一句话就卡住"就是这么来的。
  // 请求期间整张纸片由 .slip.hidden 淡出，不需要再单独禁一次输入行。
  $("inputLine").classList.toggle("is-off", S.safety || ended || S.awaiting);
  field.value = "";
  field.disabled = S.safety || ended;
  sendBtn.disabled = S.safety || ended;
  field.placeholder = S.safety ? "先停在这里" : ended ? "这一轮结束了" : "或者，自己说";

  confirmRow.classList.toggle("on", S.awaiting);
  if (S.awaiting) {
    $("cfYes").disabled = false;
    $("cfEdit").disabled = false;
  }

  if (isStart) {
    renderSeeds();
    field.focus();
  }

  renderHint(t);
  renderMood(t);
  renderCrisis(t);
}

function renderSeeds() {
  const seeds = ["下周要组会汇报，一想到就手心出汗", "和室友有点别扭，说不清", "就是睡不着，脑子停不下来"];
  $("slipOpts").innerHTML = seeds
    .map((o) => '<button data-answer="' + o.replace(/"/g, "&quot;") + '">' + o + "</button>")
    .join("");
}

/* ---------- 偏差提示 / 情绪刻度 / 危机卡片 ---------- */

function renderHint(t) {
  const row = $("hintRow");
  const tags = Array.isArray(t.distortions) ? t.distortions : [];
  const show = tags.length && ["COGNITIVE_REVIEW", "INTERVENTION_DECISION"].includes(t.stage);
  row.classList.toggle("on", Boolean(show));
  if (!show) { row.innerHTML = ""; return; }
  row.innerHTML = "这句话里有点 <b>「" + tags.join("」「") + "」</b> 的影子。"
    + "不用急着承认或否认，先看看有没有不一样的情况。";
}

function renderMood(t) {
  const row = $("moodRow");
  const on = !S.safety && t.status !== "ended";
  row.classList.toggle("on", on);
  if (!on) return;
  const scale = $("moodScale");
  if (!scale.children.length) {
    scale.innerHTML = Array.from({ length: 11 }, (_, i) =>
      '<button data-score="' + i + '" class="' + (i <= 3 ? "low" : "") + '">' + i + "</button>").join("");
  }
  const scores = Array.isArray(t.moodSeries) ? t.moodSeries : [];
  const last = scores.length ? scores[scores.length - 1] : null;
  [...scale.children].forEach((b) => b.classList.toggle("on", Number(b.dataset.score) === last));
  drawCurve(scores);
}

/** 一条细折线：只画用户自己给的分，不做平滑，不做预测。 */
function drawCurve(scores) {
  const svg = $("moodCurve");
  if (scores.length < 2) { svg.innerHTML = ""; return; }
  const w = 240, h = 34, pad = 2;
  const pts = scores.map((s, i) => {
    const x = pad + (i / (scores.length - 1)) * (w - pad * 2);
    const y = h - pad - (s / 10) * (h - pad * 2);
    return [x, y];
  });
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  svg.innerHTML = '<path d="' + d + '" fill="none" stroke="rgba(36,31,26,.45)" stroke-width="1"/>'
    + pts.map((p) => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1)
      + '" r="1.8" fill="rgba(36,31,26,.55)"/>').join("");
}

async function logMood(score) {
  if (!S.id || S.busy) return;
  try {
    const view = await api("/" + S.id + "/mood", jsonBody({ score }));
    S.moods = view.moodSeries || [];
    drawCurve(S.moods);
    [...$("moodScale").children].forEach((b) =>
      b.classList.toggle("on", Number(b.dataset.score) === score));
    say(score <= 3 ? "记下了。" + score + " 分。要不要先停一下，缓口气？" : "记下了 · " + score + " 分");
  } catch (e) {
    say("没记上：" + e.message, 3000);
  }
}

function maskPhone(phone) {
  if (!phone) return "";
  return phone.length >= 7 ? phone.slice(0, 3) + "****" + phone.slice(-2) : phone;
}

function renderCrisis(t, target, sessionId) {
  const card = target || $("crisisCard");
  const c = t.crisis;
  // 门外也要能存联系人：写哪一段会话由调用方给，不能默认用屋里那一段。
  const sid = sessionId || S.id;
  if (!c) { card.classList.remove("on"); card.innerHTML = ""; return; }
  const phone = c.contactPhone || "";
  const whoActions = phone
    ? '<div class="who-acts">'
      + '<a href="tel:' + encodeURIComponent(phone) + '">拨号</a>'
      + '<a href="sms:' + encodeURIComponent(phone) + '?body=' + encodeURIComponent(c.notice || "") + '">发短信</a>'
      + "<span>由你按下发送，系统不代发</span></div>"
    : "";
  const who = c.contactName
    ? '<div class="who">可以联系的人：' + esc(c.contactName)
      + (c.contactRelation ? "（" + esc(c.contactRelation) + "）" : "")
      + " · " + esc(maskPhone(c.contactPhone)) + "</div>" + whoActions
    : '<div class="who">还没留联系人。留一个，下次这种时候卡片里就会有他。</div>';

  card.innerHTML =
    '<h4>现在可以做的事</h4>'
    + '<div class="num">' + c.hotlines.map(esc).join("\n") + "</div>"
    + who
    + '<textarea class="notice" id="noticeBox" readonly>' + esc(c.notice) + "</textarea>"
    + '<div class="btns">'
    + '<button class="primary" id="copyNotice">复制发给联系人的话</button>'
    + '<button id="toggleContact">' + (c.contactName ? "换一个联系人" : "留一个联系人") + "</button>"
    + "</div>"
    + '<div class="form" id="contactForm">'
    + '<input id="cName" placeholder="怎么称呼" maxlength="32" value="' + esc(c.contactName || "") + '">'
    + '<input id="cPhone" placeholder="手机号（可不填）" maxlength="32" value="' + esc(c.contactPhone || "") + '">'
    + '<input id="cRel" placeholder="关系，如室友" maxlength="16" value="' + esc(c.contactRelation || "") + '">'
    + '<button id="saveContact">存下</button>'
    + "</div>";
  card.classList.add("on");

  $("copyNotice").addEventListener("click", async () => {
    const box = $("noticeBox");
    box.classList.add("on");
    try {
      await navigator.clipboard.writeText(c.notice);
      say("已复制。发不发由你决定。");
    } catch (e) {
      box.focus(); box.select();
      say("选中了，按 Ctrl+C 复制");
    }
  });
  $("toggleContact").addEventListener("click", () => $("contactForm").classList.toggle("on"));
  $("saveContact").addEventListener("click", async () => {
    try {
      await api("/" + sid + "/contact", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: $("cName").value.trim(),
          phone: $("cPhone").value.trim(),
          relation: $("cRel").value.trim()
        })
      });
      say("存下了。只有你自己看得见。");
      $("contactForm").classList.remove("on");
    } catch (e) {
      say("没存上：" + e.message, 3000);
    }
  });
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ---------- 语音：浏览器内识别，不留音频 ---------- */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
let listening = false;
let recogBtn = null;

/** 语音只负责"把话变成字"，写进哪个框由调用方给：屋里是纸片，门外是输入条。 */
function toggleVoice(input, btn) {
  if (!input || input.disabled) return;
  if (!SR) { toggleRecordedVoice(input, btn); return; }
  if (listening) { try { recog.stop(); } catch (e) { /* 已经在收尾 */ } return; }
  recogBtn = btn;
  recog = new SR();
  recog.lang = "zh-CN";
  recog.interimResults = true;
  recog.continuous = false;
  recog.onresult = (e) => {
    let text = "";
    for (const r of e.results) text += r[0].transcript;
    input.value = text;
  };
  recog.onerror = (e) => {
    listening = false;
    if (recogBtn) recogBtn.classList.remove("on");
    say(e.error === "not-allowed" ? "没拿到麦克风权限" : "没听清，再说一次？");
  };
  recog.onend = () => {
    listening = false;
    if (recogBtn) recogBtn.classList.remove("on");
  };
  try {
    recog.start();
    listening = true;
    btn.classList.add("on");
    say("在听…说完点一下，或者直接按发送");
  } catch (e) {
    say("语音起不来：" + e.message, 3000);
  }
}

/* ---------- Firefox 退路：录音 → 本机转写，不保存音频 ---------- */

let recorder = null;

async function toggleRecordedVoice(input, btn) {
  if (recorder) { stopRecordedVoice(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const source = ctx.createMediaStreamSource(stream);
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    processor.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    source.connect(processor);
    processor.connect(ctx.destination);
    recorder = { stream, ctx, source, processor, chunks, input, btn };
    btn.classList.add("on");
    say("在录…说完点一下。音频只发到本机转写，不保存。");
  } catch (e) {
    say("没拿到麦克风权限，先用文字吧");
  }
}

async function stopRecordedVoice() {
  const r = recorder;
  recorder = null;
  if (!r) return;
  r.btn.classList.remove("on");
  r.stream.getTracks().forEach((t) => t.stop());
  r.processor.disconnect();
  r.source.disconnect();
  const rate = r.ctx.sampleRate;
  r.ctx.close();

  const merged = mergeChunks(r.chunks);
  if (!merged.length) { say("没录到声音"); return; }
  const pcm = resample(merged, rate, 16000);
  const wav = encodeWav(pcm, 16000);
  say("正在本机转写…");
  try {
    const res = await fetch("/api/asr/transcribe", {
      method: "POST",
      headers: { "Content-Type": "audio/wav" },
      body: wav
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || "转写失败");
    if (data.text) {
      r.input.value = (r.input.value ? r.input.value + " " : "") + data.text;
      say("听写好了，看看有没有错字。");
    } else {
      say("没听清，再说一次？");
    }
  } catch (e) {
    say(e.message, 3200);
  }
}

function mergeChunks(chunks) {
  let length = 0;
  chunks.forEach((c) => { length += c.length; });
  const out = new Float32Array(length);
  let at = 0;
  chunks.forEach((c) => { out.set(c, at); at += c.length; });
  return out;
}

/** 线性重采样；语音只要 16k，够用且不引第三方库。 */
function resample(input, from, to) {
  if (from === to) return input;
  const ratio = from / to;
  const out = new Float32Array(Math.round(input.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const at = i * ratio;
    const left = Math.floor(at);
    const right = Math.min(input.length - 1, left + 1);
    const weight = at - left;
    out[i] = input[left] * (1 - weight) + input[right] * weight;
  }
  return out;
}

function encodeWav(samples, rate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  const write = (offset, text) => {
    for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
  };
  write(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  write(8, "WAVE");
  write(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, rate, true);
  view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  write(36, "data");
  view.setUint32(40, samples.length * 2, true);
  let at = 44;
  for (let i = 0; i < samples.length; i++) {
    const v = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(at, v < 0 ? v * 0x8000 : v * 0x7fff, true);
    at += 2;
  }
  return new Blob([view], { type: "audio/wav" });
}

async function ensureSession() {

function newClientId(kind) {
  return kind + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6);

async function send(text) {
  if (!text || !text.trim() || S.busy || S.safety) return;
  if (!S.id) await ensureSession();
  if (S.awaiting) {
    say("这一步要先确认，或者点「我再改改」");
    return;
  }
  if (S.editing) {
    await submitEdited(text.trim());
    return;
  }
  S.busy = true;
  slip.classList.add("hidden");
  flyOut();
  try {
    const t = await api("/" + S.id + "/messages", jsonBody({
      message: text.trim(),
      clientMessageId: newClientId("m")
    }));
    applyTurn(t, false);
  } catch (e) {
    say("没送出去：" + e.message, 3200);
    setConn("连接不稳", true);
    slip.classList.remove("hidden");
  } finally {
    S.busy = false;
  }
}

/** 「我再改改」：把用户自己写的说法交给 /confirm，而不是当成普通消息。 */

    }));

    applyTurn(t, false);
  } catch (e) {
    say("没记下来：" + e.message, 3200);
    slip.classList.remove("hidden");
  } finally {
    S.busy = false;

}

/** 门外用自己的一套路径（/api/free），令牌与屋里共用一枚。 */
async function freeApi(path, options) {
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({}, opts.headers || {});
  if (S.token) opts.headers["X-User-Token"] = S.token;

  const res = await fetch(FREE_API + path, opts);
  const fresh = res.headers.get("X-User-Token");
  if (fresh) {
    S.token = fresh;
    localStorage.setItem("sm-token", fresh);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.message || data.error || ("请求失败 " + res.status));
  }
  return data;
}

function makeStars() {
  if (W.stars) return;
  W.stars = true;

  // 星点：位置避开月亮右上方那一块（那里本来就被月光压白了）；
  // 大小与闪烁周期都随机，否则整片天空会“齐步闪”，一眼就是程序画的。
  const box = $("wstars");
  for (let i = 0; i < 96; i++) {
    const star = document.createElement("i");
    const left = Math.random() * 100;
    const top = Math.random() * 58;
    const size = (Math.random() < 0.12 ? 2.4 : 1 + Math.random() * 0.9).toFixed(2);
    star.style.left = left.toFixed(2) + "%";
    star.style.top = top.toFixed(2) + "%";
    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.opacity = (0.18 + Math.random() * 0.55).toFixed(2);
    star.style.animationDelay = (Math.random() * 7).toFixed(2) + "s";
    star.style.animationDuration = (4.5 + Math.random() * 6).toFixed(2) + "s";
    box.appendChild(star);
  }

  // 萤火：贴着山脚那一带，慢慢上下漂
  const fire = $("wfire");
  for (let i = 0; i < 14; i++) {
    const dot = document.createElement("i");
    dot.style.left = (4 + Math.random() * 92).toFixed(2) + "%";
    dot.style.top = (62 + Math.random() * 26).toFixed(2) + "%";
    dot.style.animationDelay = (Math.random() * 14).toFixed(2) + "s";
    dot.style.animationDuration = (11 + Math.random() * 9).toFixed(2) + "s";
    fire.appendChild(dot);
  }
}

function clearWorldLog() {

}

function appendWorld(role, text) {
  const row = document.createElement("div");
  row.className = "wmsg " + (role === "user" ? "me" : "her");
  row.textContent = text;
  // 危机卡片常驻在 log 末尾，新消息一律插在它前面
  wlog.insertBefore(row, wCrisis);
  return row;
}

/** 走到门外。服务端会接着上一段没结束的对话，不会每次都重新打招呼。 */
async function enterWorld() {
  showScene(world);
  makeStars();
  if (W.loaded) {
    if (!wfield.disabled) wfield.focus();
    return;
  }
  wsend.disabled = true;
  try {
    const data = await freeApi("/start", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });
    W.id = data.sessionId;
    localStorage.setItem("sm-free", W.id);
    clearWorldLog();
    (data.messages || []).forEach((m) => appendWorld(m.role, m.content));
    const paused = data.status === "safety_hold" && data.crisis;
    if (paused) {
      renderCrisis({ crisis: data.crisis }, wCrisis, W.id);
      wfield.placeholder = "先停在这里";
    }
    wfield.disabled = Boolean(paused);
    W.loaded = true;
    scrollWorld();
  } catch (e) {
    clearWorldLog();
    appendWorld("her", "门外没连上：" + e.message);
  } finally {
    wsend.disabled = false;
    if (!wfield.disabled) wfield.focus();
  }
}

async function worldSay() {
  const text = wfield.value.trim();
  if (!text || W.busy || !W.id || wfield.disabled) return;
  W.busy = true;
  wsend.disabled = true;
  appendWorld("user", text);
  wfield.value = "";
  const pending = appendWorld("her", "…");
  pending.classList.add("pending");
  scrollWorld();

  try {
    const data = await freeApi("/" + W.id + "/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        clientMessageId: "wm-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6)
      })
    });
    pending.remove();
    appendWorld("her", data.reply || "");
    if (data.status === "safety_hold" && data.crisis) {
      renderCrisis({ crisis: data.crisis }, wCrisis, W.id);
      wfield.disabled = true;
      wfield.placeholder = "先停在这里";
      say("先停一下。卡片在下面。", 2800);
    }
  } catch (e) {
    pending.remove();
    appendWorld("her", "没送出去：" + e.message);
  } finally {
    W.busy = false;
    wsend.disabled = Boolean(wfield.disabled);
    scrollWorld();
  }
}

function hash(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

async function renderOutside() {

    setConn("连着 · 窗外 " + S.rows.length + (S.hasMore ? "+" : "") + " 个泡泡");
  } catch (e) {
    // 还没有令牌 = 还没有开过口，这不是错误；把 401 当成"空"处理。
    if (S.token) setConn("读不到记录：" + e.message, true);
    else setConn("窗外还没有东西");

/**
 * 翻页用游标，不用 offset：一边翻一边新开一轮时，offset 会把同一条记录显示两次。
 * 游标是服务端给的一串东西，客户端只管原样带回去。
 */
function pageOf(cursor) {
  return api("/page?limit=40" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : ""));
}

function paintBubbles() {
  const box = document.getElementById("bubbles");
  box.innerHTML = "";

  const cards = S.rows.map((r) => {
    const h = hash(r.sessionId);
    return {
      id: r.sessionId,
      label: (r.targetProblem || r.stageLabel || "一次对话").slice(0, 12),
      when: new Date(r.updatedAt).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" }),
      x: 12 + (h % 72),
      y: 14 + ((h >> 8) % 58),
      r: Math.min(96, 26 + (r.turnCount || 0) * 5),
      live: r.sessionId === S.id && (r.turnCount || 0) > 0,
      turns: r.turnCount || 0
    };
  });

  if (!cards.length) {
    const empty = document.createElement("div");
    empty.className = "bubble empty";
    empty.style.left = "57%";
    empty.style.top = "70%";
    empty.style.width = empty.style.height = "54px";
    empty.innerHTML = '<div class="lbl">还没有说出口的话</div>';
    box.appendChild(empty);
  }

  cards.forEach((b, i) => {
    const el = document.createElement("div");
    el.className = "bubble" + (b.live ? " live" : "");
    el.style.left = b.x + "%";
    el.style.top = b.y + "%";
    el.style.width = el.style.height = b.r + "px";
    el.style.animationDelay = (i * 0.4) + "s";
    el.innerHTML =
      '<div class="inner"></div><div class="lbl">' + escapeHtml(b.label) +
      '</div><div class="age">' + b.when + " · " + b.turns + " 轮</div>";
    el.addEventListener("click", () => openReader(b));
    box.appendChild(el);
  });

  document.getElementById("outCount").textContent =
    cards.length
      ? "窗外有 " + cards.length + " 次对话" + (S.hasMore ? "（还有更早的）" : "")
      : "还没有说出口的话";
  const more = document.getElementById("more");
  more.hidden = !S.hasMore;
  more.textContent = "更早的";
}

document.getElementById("more").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  btn.textContent = "取更早的…";
  try {
    const page = await pageOf(S.cursor);
    const known = new Set(S.rows.map((r) => r.sessionId));
    (page.items || []).forEach((r) => { if (!known.has(r.sessionId)) S.rows.push(r); });
    S.cursor = page.nextCursor;
    S.hasMore = Boolean(page.hasMore);
    paintBubbles();
  } catch (err) {
    btn.textContent = "没取到，再试一次";
    btn.disabled = false;
    return;
  }
  btn.disabled = false;
});

/**
 * 跨会话趋势：只画用户自己点过的分，按天取平均。
 * 不做插值、不预测——两天之间没有点，就空着；线断着比补一条假线诚实。
 */
async function renderTrend() {
  const panel = document.getElementById("trend");
  const svg = document.getElementById("trendCurve");
  try {
    const headers = {};
    if (S.token) headers["X-User-Token"] = S.token;
    const res = await fetch("/api/cbt/mood/trend?days=30", { headers });
    if (!res.ok) throw new Error("trend " + res.status);
    const data = await res.json();
    if (!data.points || !data.daily || !data.daily.length) {
      panel.classList.remove("on");
      return;
    }
    panel.classList.add("on");
    document.getElementById("trendNote").textContent =
      data.points + " 次 · " + data.sessions + " 轮";

    const W = 300, H = 54, pad = 5;
    const day = (s) => new Date(s + "T00:00:00").getTime();
    const from = day(data.from), to = day(data.to);
    const span = Math.max(1, to - from);
    const px = (d) => pad + (day(d) - from) / span * (W - pad * 2);
    const py = (v) => H - pad - (v / 10) * (H - pad * 2);

    let out = "";
    [0, 5, 10].forEach((v) => {
      out += '<line class="base" x1="' + pad + '" y1="' + py(v) + '" x2="' + (W - pad) + '" y2="' + py(v) + '"/>';
    });
    // 只连相邻的日子：中间空了几天就断开，不画一条穿过空白的长线。
    // 断开本身是信息——"这几天没点"和"这几天分数平稳"不是一回事。
    let segment = [];
    const flush = () => {
      if (segment.length > 1) {
        out += '<polyline class="line" points="' + segment.join(" ") + '"/>';
      }
      segment = [];
    };
    let prev = null;
    data.daily.forEach((d) => {
      if (prev && (day(d.date) - day(prev)) / 86400000 > 1.5) flush();
      segment.push(px(d.date) + "," + py(d.average));
      prev = d.date;
      out += '<circle class="dot" cx="' + px(d.date) + '" cy="' + py(d.average) + '" r="1.8"/>';
    });
    flush();
    svg.innerHTML = out;
  } catch (e) {
    panel.classList.remove("on");
  }
}

function escapeHtml(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const reader = document.getElementById("reader");

async function openReader(b) {
  readerSession = b.id;
  $("shareUrl").hidden = true;
  $("shareNote").hidden = true;
  $("readerCopy").hidden = true;
  $("readerRevoke").hidden = true;
  $("readerShare").hidden = false;

    document.getElementById("readerBody").innerHTML = msgs

        escapeHtml(m.content) + "</div>")

      : "记录已存下：阶段、确认过什么、当时说了什么。";
  } catch (e) {
    document.getElementById("readerBody").innerHTML =
      '<div class="line-row">读不到这条记录：' + escapeHtml(e.message) + "</div>";

}
/**
 * 一次性链接：把这一轮交给某一个人看，而不是公开。链接只能打开一次，24 小时后过期。
 * 生成后不再显示明文 token 以外的任何信息；撤回只影响还没被打开的链接。

    const url = location.origin + data.path;
    const input = $("shareUrl");
    input.hidden = false;
    input.value = url;
    $("readerCopy").hidden = false;
    $("readerRevoke").hidden = false;
    const note = $("shareNote");

    showSceneNote("已生成，复制后发给对方。");
    try {
      await navigator.clipboard.writeText(url);

    } catch (e) {
      input.select();
    }
  } catch (e) {
    showSceneNote("没生成：" + e.message);
  } finally {
    btn.disabled = false;
  }
});

function flyOut() {
  const w = win.getBoundingClientRect();
  const start = { x: window.innerWidth * 0.55, y: window.innerHeight * 0.72 };
  const target = { x: w.left + w.width / 2, y: w.top + w.height / 2 };
  const el = document.createElement("div");
  el.className = "flying";
  el.style.left = start.x + "px";
  el.style.top = start.y + "px";
  document.body.appendChild(el);
  const midX = (start.x + target.x) / 2 + 40;
  const midY = Math.min(start.y, target.y) - 70;
  el.animate([
    { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1 },
    { transform: "translate(" + (midX - start.x) + "px," + (midY - start.y) + "px) rotate(-14deg) scale(.85)", opacity: 1, offset: 0.55 },
    { transform: "translate(" + (target.x - start.x) + "px," + (target.y - start.y) + "px) rotate(-26deg) scale(.2)", opacity: 0 }
  ], { duration: 1100, easing: "cubic-bezier(.4,0,.6,1)" });
  setTimeout(() => {
    el.remove();
    const star = document.createElement("i");
    star.className = "new";
    star.style.left = (8 + Math.random() * 84) + "%";
    star.style.top = (6 + Math.random() * 70) + "%";
    nightsky.appendChild(star);
    win.classList.add("lit");
  }, 1050);
}

/* ---------- 启动 ---------- */

/**
 * 刷新后接着上一轮说。
 * 之前只把身份存在本机、会话 id 不落地——刷新一次就"人还在、话没了"，
 * 而库里那条会话仍是 running，等于一条永远续不上的记录。
 */
async function resumeIfAny() {
  const saved = localStorage.getItem("sm-session");
  if (!saved) return false;
  try {
    const s = await api("/" + saved);
    if (s.status === "ended") {
      localStorage.removeItem("sm-session");
      return false;
    }
    const msgs = await api("/" + saved + "/history");
    const last = [...msgs].reverse().find((m) => m.role === "assistant");
    S.turns = Math.max(1, (s.turnCount || 1) - 1);
    applyTurn({
      sessionId: s.sessionId,
      stage: s.stage,
      stageLabel: s.stageLabel,
      visibleIndex: s.visibleIndex,
      status: s.status,
      awaitingConfirmation: s.awaitingUser,
      response: last ? last.content : ""
    }, false);
    setConn("接着上一轮 · " + (s.stageLabel || ""));
    return true;
  } catch (e) {
    // 令牌过期（服务端换了密钥）或记录已删：当作没有上一轮，别把人挡在门外。
    S.token = null;
    S.id = null;
    localStorage.removeItem("sm-token");
    localStorage.removeItem("sm-session");
    return false;
  }
}

paintStones();
setConn("同源接口已就绪");

(async () => {
  if (DEMO === "1") return;
  const resumed = await resumeIfAny();
  if (VIEW === "outside") {
    showScene(outside);
    renderOutside();
  } else if (VIEW === "world") {
    enterWorld();
  } else if (resumed) {
    slip.classList.remove("hidden");
  }
})();


/**
 * 演示脚本：?demo=1 走一遍完整五步；?demo=safety 走到检验后触发安全暂停。
 * 两条都走真实接口与真实安全规则，不是前端假动画——演示时说什么就真的发生什么。
 */
const DEMO_LINES = {
  "1": [
    "下周组会要汇报，一想到就手心出汗",
    "我肯定会搞砸",
    "前三次有两次其实还行，组长只提了数据口径",
    "提前写下三条具体预测，会后逐条核对",
    "汇报前把三条预测写在便签上"
  ],
  safety: [
    "下周组会要汇报，一想到就手心出汗",
    "我肯定会被开除，一切都完了",
    "上次其实只是被提醒了一句"
  ]
};

/* 账号入口：房间里不写邮箱、不写"已登录"，只用一个小点说明这枚令牌是账号级别的。
   接口不通时不提示任何东西——房间该安静。 */
(async function accountBadge() {
  const btn = $("acctBtn");
  if (!btn || !S.token) return;
  try {
    const res = await fetch("/api/auth/me", { headers: { "X-User-Token": S.token } });
    if (!res.ok) return;
    const me = await res.json();
    if (me.signedIn && me.account) {
      btn.classList.add("on");
      btn.title = (me.account.displayName || me.account.email) + " · 账号与退出";
    }
  } catch (e) { /* 忽略 */ }
})();

if (DEMO) {
  (async () => {
    try {
      await ensureSession();
      for (const line of DEMO_LINES[DEMO] || DEMO_LINES["1"]) {
        await new Promise((r) => setTimeout(r, 1400));
        await send(line);
      }
      // 安全演示要先过"确认"这道中断点：普通消息推不动它，这是设计而不是 bug。
      if (DEMO === "safety") {
        await new Promise((r) => setTimeout(r, 900));
        if (S.awaiting) {
          await confirmThought();
          await new Promise((r) => setTimeout(r, 900));
        }
        await send("我真的不想活了");
      }
      if (VIEW === "outside") {
        showScene(outside);
        renderOutside();
      }
    } catch (e) {
      say("演示失败：" + e.message, 3200);
    }
  })();
}
