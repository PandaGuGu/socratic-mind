<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mind · 模型仪表盘</title>
<link rel="stylesheet" href="./app.css">
<style>
  .ai-wrap { min-height: 0; overflow-y: auto; padding: 24px 28px 44px; }
  .ai-head h2 { font-size: 16px; font-weight: 600; }
  .ai-head p { margin-top: 5px; font-size: 11.5px; color: var(--muted); max-width: 64em; line-height: 1.8; }
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin: 18px 0 22px; max-width: 1000px; }
  .stat { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 12px 14px; }
  .stat b { display: block; font-size: 21px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10.5px; color: var(--muted); letter-spacing: .05em; }
  .meta-line { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-bottom: 14px; }
  .table-wrap { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); max-width: 1100px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  th { text-align: left; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line);
    font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: .06em; color: var(--muted); }
  td { padding: 7px 12px; border-bottom: .5px solid var(--line-soft); color: var(--ink-soft); }
  tr:last-child td { border-bottom: 0; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .bad { color: var(--refer); }
  .ok { color: var(--accent-deep); }
  .note { margin-top: 14px; font-size: 11.5px; color: var(--muted); line-height: 1.8; max-width: 64em; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, 1fr); } .table-wrap { overflow-x: auto; } table { min-width: 720px; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3v18M3 12h18"></path>
      </svg>
      <div class="brand-text">
        <h1>Socratic Mind <span>模型仪表盘</span></h1>
        <p>延迟实测 · token 估算 · 本地模型 0 元</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn" href="./index.html">会话</a>
      <a class="btn" href="./review.html">审核</a>
      <a class="btn" href="./settings.html">规则与参数</a>
      <button class="btn" id="refreshBtn" type="button">刷新</button>
    </div>
  </header>

  <main class="ai-wrap">
    <div class="ai-head">
      <h2>最近 300 次调用</h2>
      <p>
        这里回答三个之前没有数据的问题：模型有多慢、一句话大概多少 token、有没有在失败。
        延迟包含排队与推理；token 是估算，不是上游账单。
      </p>
    </div>

    <div class="stats">
      <div class="stat"><b id="stCalls">—</b><span>调用次数</span></div>
      <div class="stat"><b id="stP50">—</b><span>P50 延迟</span></div>
      <div class="stat"><b id="stP95">—</b><span>P95 延迟</span></div>
      <div class="stat"><b id="stTokens">—</b><span>估算 token</span></div>
      <div class="stat"><b id="stErrors">—</b><span>失败</span></div>
    </div>

    <div class="meta-line" id="meta"></div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>时间</th><th>类型</th><th>模型</th><th>耗时</th><th>估算 token</th><th>结果</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" style="padding:28px;text-align:center;color:var(--muted)">正在读取…</td></tr></tbody>
      </table>
    </div>

    <p class="note" id="costNote"></p>
  </main>
</div>
<script src="./auth.js"></script>
<script src="./ai.js"></script>
</body>
</html>
