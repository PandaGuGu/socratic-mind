<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mind · 敏感词库</title>
<link rel="stylesheet" href="./app.css">
<style>
  .lex-wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 0;
    min-height: 0;
    overflow: hidden;
  }
  /* 整表编辑默认只给一屏；点“展开编辑”后让整页滚动，能一次看完所有词条 */
  .lex-wrap.is-expanded {
    grid-template-columns: 1fr;
    overflow-y: auto;
  }
  .lex-wrap.is-expanded .lex-side { display: none; }
  .lex-wrap.is-expanded .lex-main { overflow: visible; }
  .lex-wrap.is-expanded .lex-editor { flex: none; }
  .lex-wrap.is-expanded .lex-editor textarea {
    flex: none;
    min-height: 420px;
    height: auto;
    overflow: hidden;
  }
  .lex-main {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 22px 26px 8px;
    overflow: hidden;
  }
  .lex-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .lex-head h2 {
    font-size: 15px;
    font-weight: 600;
  }
  .lex-head .meta {
    font-size: 11px;
    color: var(--muted);
  }
  .lex-head #expandBtn { margin-left: auto; }
  .lex-editor {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .lex-editor textarea {
    flex: 1;
    min-height: 240px;
    width: 100%;
    resize: none;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
    tab-size: 2;
  }
  .lex-editor textarea:focus {
    outline: 2px solid var(--accent-line);
    outline-offset: 1px;
  }
  .lex-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 0 14px;
  }
  .lex-bar .spacer { flex: 1; }
  .lex-bar .hint {
    font-size: 11px;
    color: var(--muted);
  }
  .lex-msg {
    font-size: 11.5px;
    padding: 8px 12px;
    border-radius: var(--r-sm);
    margin-bottom: 10px;
    display: none;
  }
  .lex-msg.is-on { display: block; }
  .lex-msg.is-ok { background: var(--accent-soft); color: var(--accent-deep); }
  .lex-msg.is-bad { background: var(--refer-soft); color: var(--refer); }
  .lex-side {
    border-left: 1px solid var(--line);
    background: var(--surface);
    min-height: 0;
    overflow-y: auto;
    padding: 22px 20px 32px;
  }
  .lex-side h3 {
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .lex-side section + section { margin-top: 22px; }
  .lex-side p.tip {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .lex-side textarea,
  .lex-side input[type="text"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 12px;
    background: var(--surface-2);
    color: var(--ink);
  }
  .lex-side textarea { min-height: 62px; resize: vertical; }
  .lex-row-inline {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .hit-list { margin-top: 8px; font-size: 11.5px; }
  .hit-list li {
    display: flex;
    gap: 8px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--line-soft);
  }
  .hit-list li b { font-weight: 600; }
  .hist { font-size: 11.5px; }
  .hist li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line-soft);
    color: var(--ink-soft);
  }
  .hist li span:last-child { color: var(--muted); white-space: nowrap; }
  .hist .link {
    padding: 0 2px;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-size: 10.5px;
    cursor: pointer;
  }
  .hist .link:hover { text-decoration: underline; }
  @media (max-width: 980px) {
    .lex-wrap { grid-template-columns: 1fr; overflow-y: auto; }
    .lex-main { overflow: visible; }
    .lex-side { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="app is-shell">

    <aside class="sb">
    <div class="sb-brand">
      <span class="sb-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"></circle><path d="M12 3.4v17.2M3.4 12h17.2"></path></svg>
      </span>
      <span class="sb-name">
        <b>Socratic Mind</b>
        <small>内部后台</small>
      </span>
    </div>

    <nav class="sb-nav">
      <p class="sb-label">运营</p>
      <a class="sb-item" href="./index.html">
        <svg viewBox="0 0 16 16"><path d="M3 3.6h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7.2L4.4 13.6v-2H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"></path></svg>

      <a class="sb-item" href="./review.html">
        <svg viewBox="0 0 16 16"><path d="M3 8.4 6.2 11.6 13 4.8"></path></svg>

      </a>
      <a class="sb-item" href="./accounts.html">

      <a class="sb-item" href="./login.html">
        <svg viewBox="0 0 16 16"><path d="M9.2 3.6H4.6a1 1 0 0 0-1 1v6.8a1 1 0 0 0 1 1h4.6"></path><path d="M11 5.9 13 8l-2 2.1M6.4 8h6.4"></path></svg>

      </a>

      <p class="sb-label">配置</p>
      <a class="sb-item" href="./flow.html">
        <svg viewBox="0 0 16 16"><circle cx="4" cy="4" r="1.6"></circle><circle cx="12" cy="6.2" r="1.6"></circle><circle cx="7" cy="12" r="1.6"></circle><path d="M5.5 4.4 10.5 5.6M4.6 5.5l1.9 5"></path></svg>
        流程画布
      </a>
      <a class="sb-item" href="./policy.html">
        <svg viewBox="0 0 16 16"><path d="M8 2.5 12.8 4.4v3.9c0 3-1.9 4.6-4.8 5.4-2.9-.8-4.8-2.4-4.8-5.4V4.4Z"></path></svg>
        输出策略
      </a>
      <a class="sb-item" href="./settings.html">
        <svg viewBox="0 0 16 16"><path d="M2.6 5.2h2.2M8.2 5.2h5.2M2.6 10.8h5.2M11.2 10.8h2.2"></path><circle cx="6.6" cy="5.2" r="1.5"></circle><circle cx="9.6" cy="10.8" r="1.5"></circle></svg>
        规则与参数
      </a>
      <a class="sb-item is-on" href="./lexicon.html">
        <svg viewBox="0 0 16 16"><path d="M3.2 3.6h3.9a1 1 0 0 1 1 1v8H4.2a1 1 0 0 1-1-1Z"></path><path d="M12.8 3.6H8.9a1 1 0 0 0-1 1v8h3.9a1 1 0 0 0 1-1Z"></path></svg>

      </a>
      <a class="sb-item" href="./ai.html">
        <svg viewBox="0 0 16 16"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.2"></rect><path d="M6.6 2.4v2.2M9.4 2.4v2.2M6.6 11.4v2.2M9.4 11.4v2.2M2.4 6.6h2.2M2.4 9.4h2.2M11.4 6.6h2.2M11.4 9.4h2.2"></path></svg>
        模型
      </a>
      <a class="sb-item" href="./knowledge.html">
        <svg viewBox="0 0 16 16"><path d="M8 2.8 13 5.2 8 7.6 3 5.2Z"></path><path d="M3 8.6 8 11l5-2.4"></path></svg>
        知识库
      </a>
      <a class="sb-item" href="./eval.html">
        <svg viewBox="0 0 16 16"><path d="M3.2 11.4a5 5 0 1 1 9.6 0"></path><path d="M8 11.4 10.4 7.6"></path></svg>
        评测
      </a>
    </nav>
    <div class="sb-foot">
    </div>
  </aside>

  <header class="topbar">
    <div class="crumb">
      <span>内部后台</span>
      <i>/</i>
      <b>词库</b>
      <em class="crumb-note">改完即生效 · 保存前校验 · 留快照</em>
    </div>
    <div class="top-actions">
        <button class="btn" id="refreshBtn" type="button">刷新</button>
    </div>
  </header>

  <div class="lex-wrap">

    <main class="lex-main">
      <div class="lex-head">
        <h2>整表编辑</h2>
        <span class="meta" id="meta">—</span>
        <button class="btn" id="expandBtn" type="button">展开编辑</button>
      </div>

      <div class="lex-msg" id="msg" role="status"></div>

      <div class="lex-editor">
        <textarea id="editor" spellcheck="false"
                  aria-label="词库内容，一行一条 scope|category|action|word"></textarea>
      </div>

      <div class="lex-bar">
        <button class="btn btn-primary" id="saveBtn" type="button">保存并生效</button>
        <button class="btn" id="validateBtn" type="button">只校验</button>
        <button class="btn" id="resetBtn" type="button">恢复随包基线</button>
        <span class="spacer"></span>
        <span class="hint" id="countHint">—</span>
      </div>
    </main>

    <aside class="lex-side">
      <section>
        <h3>试一下</h3>
        <p class="tip">用当前生效的词库跑一次。输入侧与输出侧分开，因为两边的词本来就不该混。</p>
        <textarea id="testText" placeholder="粘贴一句话，比如：想加微信详聊"></textarea>
        <div class="lex-row-inline">
          <label><input type="radio" name="side" value="in" checked> 输入侧</label>
          <label><input type="radio" name="side" value="out"> 输出侧</label>
          <button class="btn" id="testBtn" type="button">试跑</button>
        </div>
        <ul class="hit-list" id="hits"></ul>
      </section>

      <section>
        <h3>保存门槛</h3>
        <p class="tip">
          至少 10 条、至少一条 block、至少一条 in/both；重复词条、空分类、超长词都会被拒。
          校验不通过时旧词库继续生效——宁可没改成，也不要改到一半。
        </p>
      </section>

      <section>
        <h3>历史快照</h3>
        <ul class="hist" id="history"><li><span>还没有保存过</span></li></ul>
      </section>
    </aside>

  </div>
</div>

<script src="./auth.js"></script>
<script src="./lexicon.js"></script>
</body>
</html>
