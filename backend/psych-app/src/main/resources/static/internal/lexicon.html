<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mind · 敏感词库</title>
<link rel="stylesheet" href="./app.css">
<style>
  .lex-wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 0;
    min-height: 0;
    overflow: hidden;
  }
  .lex-main {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 22px 26px 8px;
    overflow: hidden;
  }
  .lex-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .lex-head h2 {
    font-size: 15px;
    font-weight: 600;
  }
  .lex-head .meta {
    font-size: 11px;
    color: var(--muted);
  }
  .lex-editor {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .lex-editor textarea {
    flex: 1;
    min-height: 240px;
    width: 100%;
    resize: none;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.8;
    tab-size: 2;
  }
  .lex-editor textarea:focus {
    outline: 2px solid var(--accent-line);
    outline-offset: 1px;
  }
  .lex-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 10px 0 14px;
  }
  .lex-bar .spacer { flex: 1; }
  .lex-bar .hint {
    font-size: 11px;
    color: var(--muted);
  }
  .lex-msg {
    font-size: 11.5px;
    padding: 8px 12px;
    border-radius: var(--r-sm);
    margin-bottom: 10px;
    display: none;
  }
  .lex-msg.is-on { display: block; }
  .lex-msg.is-ok { background: var(--accent-soft); color: var(--accent-deep); }
  .lex-msg.is-bad { background: var(--refer-soft); color: var(--refer); }
  .lex-side {
    border-left: 1px solid var(--line);
    background: var(--surface);
    min-height: 0;
    overflow-y: auto;
    padding: 22px 20px 32px;
  }
  .lex-side h3 {
    font-size: 12px;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .lex-side section + section { margin-top: 22px; }
  .lex-side p.tip {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 8px;
  }
  .lex-side textarea,
  .lex-side input[type="text"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    font-family: var(--sans);
    font-size: 12px;
    background: var(--surface-2);
    color: var(--ink);
  }
  .lex-side textarea { min-height: 62px; resize: vertical; }
  .lex-row-inline {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
    font-size: 11.5px;
    color: var(--ink-soft);
  }
  .hit-list { margin-top: 8px; font-size: 11.5px; }
  .hit-list li {
    display: flex;
    gap: 8px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--line-soft);
  }
  .hit-list li b { font-weight: 600; }
  .hist { font-size: 11.5px; }
  .hist li {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px dashed var(--line-soft);
    color: var(--ink-soft);
  }
  .hist li span:last-child { color: var(--muted); white-space: nowrap; }
  .hist .link {
    padding: 0 2px;
    border: 0;
    background: none;
    color: var(--accent);
    font: inherit;
    font-size: 10.5px;
    cursor: pointer;
  }
  .hist .link:hover { text-decoration: underline; }
  @media (max-width: 980px) {
    .lex-wrap { grid-template-columns: 1fr; overflow-y: auto; }
    .lex-main { overflow: visible; }
    .lex-side { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3v18M3 12h18"></path>
      </svg>
      <div class="brand-text">
        <h1>Socratic Mind <span>敏感词库</span></h1>
        <p>改完即生效 · 保存前校验 · 留快照</p>
      </div>
    </div>
    <div class="top-actions">
      <a class="btn" href="./index.html">会话</a>
      <a class="btn" href="./settings.html">规则与参数</a>
      <a class="btn" href="./accounts.html">账号</a>
      <a class="btn" href="./knowledge.html">知识库</a>
      <button class="btn" id="refreshBtn" type="button">刷新</button>
    </div>
  </header>

  <div class="lex-wrap">

    <main class="lex-main">
      <div class="lex-head">
        <h2>整表编辑</h2>
        <span class="meta" id="meta">—</span>
      </div>

      <div class="lex-msg" id="msg" role="status"></div>

      <div class="lex-editor">
        <textarea id="editor" spellcheck="false"
                  aria-label="词库内容，一行一条 scope|category|action|word"></textarea>
      </div>

      <div class="lex-bar">
        <button class="btn btn-primary" id="saveBtn" type="button">保存并生效</button>
        <button class="btn" id="validateBtn" type="button">只校验</button>
        <button class="btn" id="resetBtn" type="button">恢复随包基线</button>
        <span class="spacer"></span>
        <span class="hint" id="countHint">—</span>
      </div>
    </main>

    <aside class="lex-side">
      <section>
        <h3>试一下</h3>
        <p class="tip">用当前生效的词库跑一次。输入侧与输出侧分开，因为两边的词本来就不该混。</p>
        <textarea id="testText" placeholder="粘贴一句话，比如：想加微信详聊"></textarea>
        <div class="lex-row-inline">
          <label><input type="radio" name="side" value="in" checked> 输入侧</label>
          <label><input type="radio" name="side" value="out"> 输出侧</label>
          <button class="btn" id="testBtn" type="button">试跑</button>
        </div>
        <ul class="hit-list" id="hits"></ul>
      </section>

      <section>
        <h3>保存门槛</h3>
        <p class="tip">
          至少 10 条、至少一条 block、至少一条 in/both；重复词条、空分类、超长词都会被拒。
          校验不通过时旧词库继续生效——宁可没改成，也不要改到一半。
        </p>
      </section>

      <section>
        <h3>历史快照</h3>
        <ul class="hist" id="history"><li><span>还没有保存过</span></li></ul>
      </section>
    </aside>

  </div>
</div>

<script src="./auth.js"></script>
<script src="./lexicon.js"></script>
</body>
</html>
