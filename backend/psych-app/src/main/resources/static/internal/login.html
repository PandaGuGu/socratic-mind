<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mind · 操作者登录</title>
<link rel="stylesheet" href="./app.css">
<style>
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 0; overflow: auto; padding: 40px 20px; }
  .login-card { width: 100%; max-width: 420px; border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--surface); padding: 26px 26px 20px; }
  .login-card h2 { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .login-card p.sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
  .login-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; background: var(--surface-2); color: var(--ink); margin-bottom: 14px; }
  .login-card input:focus { outline: 2px solid rgba(13, 122, 99, .25); border-color: #0d7a63; }
  .login-card button[type="submit"] { width: 100%; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; color: #b4453a; }

  /* 开发档账号：显式一块，而不是混在一段说明里 */
  .dev-box { border: 1px dashed #0d7a63; background: #f3faf8; border-radius: 8px;
    padding: 12px 14px 10px; margin-bottom: 18px; }
  .dev-box .title { font-size: 12px; letter-spacing: .04em; color: #0d7a63; font-weight: 600; margin-bottom: 8px; }
  .dev-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .dev-row span { font-size: 12px; color: var(--muted); width: 48px; flex: none; }
  .dev-row b { font-family: var(--mono); font-size: 15px; color: var(--ink); letter-spacing: .02em; }
  .dev-actions { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .dev-actions .btn { padding: 5px 12px; font-size: 12px; }
  .dev-note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3v18M3 12h18"></path>
      </svg>
      <div class="brand-text">
        <h1>Socratic Mind <span>内部后台</span></h1>
        <p>只读 · 不写业务状态 · 不是产品界面</p>
      </div>
    </div>
  </header>

  <main class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <h2>操作者登录</h2>
      <p class="sub">签名要落到具体的人，所以后台需要登录。账号由管理员创建，没有自助注册。</p>

      <!-- 默认隐藏：只有本机开发档（dev-hint 开着）才会显示，生产环境不会把默认口令摆在页面上 -->
      <div class="dev-box" id="devBox" hidden>
        <div class="title">本机开发档账号</div>
        <div class="dev-row"><span>登录名</span><b id="devUser">—</b></div>
        <div class="dev-row"><span>口令</span><b id="devPass">—</b></div>
        <div class="dev-actions">
          <button class="btn" type="button" id="fillBtn">填入并登录</button>
          <span class="dev-note" style="margin:0">仅本机有效</span>
        </div>
        <div class="dev-note">正式环境请改口令，并关掉 <code>psych.internal.dev-hint</code>——关闭后这一块不会出现。</div>
      </div>

      <label for="username">登录名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">口令</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="btn btn-primary" type="submit" id="submitBtn">登录</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </main>
</div>
<script src="./login.js"></script>
</body>
</html>
