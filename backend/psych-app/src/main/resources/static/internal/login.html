<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mind · 操作者登录</title>
<link rel="stylesheet" href="./app.css">
<style>
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 0; overflow: auto; padding: 40px 20px; }
  .login-card { width: 100%; max-width: 420px; border: 1px solid var(--line); border-radius: var(--r-md);
    background: var(--surface); padding: 26px 26px 20px; }
  .login-card h2 { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .login-card p.sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
  .login-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .login-card input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 14px; background: var(--surface-2); color: var(--ink); margin-bottom: 14px; }
  .login-card input:focus { outline: 2px solid rgba(13, 122, 99, .25); border-color: #0d7a63; }
  .login-card button[type="submit"] { width: 100%; }
  .msg { font-size: 13px; margin-top: 10px; min-height: 18px; color: #b4453a; }

  /* 开发档账号：显式一块，而不是混在一段说明里 */
  .dev-box { border: 1px dashed #0d7a63; background: #f3faf8; border-radius: 8px;
    padding: 12px 14px 10px; margin-bottom: 18px; }
  .dev-box .title { font-size: 12px; letter-spacing: .04em; color: #0d7a63; font-weight: 600; margin-bottom: 8px; }
  .dev-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .dev-row span { font-size: 12px; color: var(--muted); width: 48px; flex: none; }
  .dev-row b { font-family: var(--mono); font-size: 15px; color: var(--ink); letter-spacing: .02em; }
  .dev-actions { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
  .dev-actions .btn { padding: 5px 12px; font-size: 12px; }
  .dev-note { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div class="app is-shell">
    <aside class="sb">
    <div class="sb-brand">
      <span class="sb-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"></circle><path d="M12 3.4v17.2M3.4 12h17.2"></path></svg>
      </span>
      <span class="sb-name">
        <b>Socratic Mind</b>
        <small>内部后台</small>
      </span>
    </div>

    <nav class="sb-nav">
      <p class="sb-label">运营</p>
      <a class="sb-item" href="./index.html">
        <svg viewBox="0 0 16 16"><path d="M3 3.6h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7.2L4.4 13.6v-2H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"></path></svg>
        会话
      </a>
      <a class="sb-item" href="./review.html" data-perm="review">
        <svg viewBox="0 0 16 16"><path d="M3 8.4 6.2 11.6 13 4.8"></path></svg>
        审核
      </a>
      <a class="sb-item" href="./accounts.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="5.7" r="2.4"></circle><path d="M3.4 13.2c.6-2.5 2.4-3.7 4.6-3.7s4 1.2 4.6 3.7"></path></svg>
        账号
      </a>
      <a class="sb-item" href="./members.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><circle cx="5.6" cy="5.9" r="2.1"></circle><path d="M2.4 13c.5-2.2 1.9-3.3 3.9-3.3s3.4 1.1 3.9 3.3"></path><circle cx="11.2" cy="6.6" r="1.6"></circle><path d="M10.4 12.6c.3-1.7 1.2-2.5 2.5-2.5.9 0 1.5.4 1.9 1.2"></path></svg>
        成员
      </a>
      <a class="sb-item is-on" href="./login.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><path d="M9.2 3.6H4.6a1 1 0 0 0-1 1v6.8a1 1 0 0 0 1 1h4.6"></path><path d="M11 5.9 13 8l-2 2.1M6.4 8h6.4"></path></svg>
        登录
      </a>

      <p class="sb-label">配置</p>
      <a class="sb-item" href="./flow.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><circle cx="4" cy="4" r="1.6"></circle><circle cx="12" cy="6.2" r="1.6"></circle><circle cx="7" cy="12" r="1.6"></circle><path d="M5.5 4.4 10.5 5.6M4.6 5.5l1.9 5"></path></svg>
        流程画布
      </a>
      <a class="sb-item" href="./policy.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M8 2.5 12.8 4.4v3.9c0 3-1.9 4.6-4.8 5.4-2.9-.8-4.8-2.4-4.8-5.4V4.4Z"></path></svg>
        输出策略
      </a>
      <a class="sb-item" href="./settings.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M2.6 5.2h2.2M8.2 5.2h5.2M2.6 10.8h5.2M11.2 10.8h2.2"></path><circle cx="6.6" cy="5.2" r="1.5"></circle><circle cx="9.6" cy="10.8" r="1.5"></circle></svg>
        规则与参数
      </a>
      <a class="sb-item" href="./lexicon.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M3.2 3.6h3.9a1 1 0 0 1 1 1v8H4.2a1 1 0 0 1-1-1Z"></path><path d="M12.8 3.6H8.9a1 1 0 0 0-1 1v8h3.9a1 1 0 0 0 1-1Z"></path></svg>
        词库
      </a>
      <a class="sb-item" href="./ai.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.2"></rect><path d="M6.6 2.4v2.2M9.4 2.4v2.2M6.6 11.4v2.2M9.4 11.4v2.2M2.4 6.6h2.2M2.4 9.4h2.2M11.4 6.6h2.2M11.4 9.4h2.2"></path></svg>
        模型
      </a>
      <a class="sb-item" href="./knowledge.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M8 2.8 13 5.2 8 7.6 3 5.2Z"></path><path d="M3 8.6 8 11l5-2.4"></path></svg>
        知识库
      </a>
      <a class="sb-item" href="./eval.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M3.2 11.4a5 5 0 1 1 9.6 0"></path><path d="M8 11.4 10.4 7.6"></path></svg>
        评测
      </a>
    </nav>
    <div class="sb-foot">
    </div>
  </aside>

  <header class="topbar">
    <div class="crumb">
      <span>内部后台</span>
      <i>/</i>
      <b>登录</b>
      <em class="crumb-note">只读 · 不写业务状态 · 不是产品界面</em>
    </div>
  </header>

  <main class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <h2>操作者登录</h2>
      <p class="sub">签名要落到具体的人，所以后台需要登录。账号由管理员创建，没有自助注册。</p>

      <!-- 默认隐藏：只有本机开发档（dev-hint 开着）才会显示，生产环境不会把默认口令摆在页面上 -->
      <div class="dev-box" id="devBox" hidden>
        <div class="title">本机开发档账号</div>
        <div class="dev-row"><span>登录名</span><b id="devUser">—</b></div>
        <div class="dev-row"><span>口令</span><b id="devPass">—</b></div>
        <div class="dev-actions">
          <button class="btn" type="button" id="fillBtn">填入并登录</button>
          <span class="dev-note" style="margin:0">仅本机有效</span>
        </div>
        <div class="dev-note">正式环境请改口令，并关掉 <code>psych.internal.dev-hint</code>——关闭后这一块不会出现。</div>
      </div>

      <label for="username">登录名</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">口令</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button class="btn btn-primary" type="submit" id="submitBtn">登录</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </main>
</div>
<script src="./login.js"></script>
</body>
</html>
