<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mind · 在线评测</title>
<link rel="stylesheet" href="./app.css">
<style>
  .eval-wrap { padding: 24px 28px 48px; max-width: 1280px; overflow: auto; min-height: 0; }
  .eval-head h2 { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .eval-head p { font-size: 13px; line-height: 1.7; color: var(--muted); max-width: 72ch; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 14px 16px; }
  .stat dt { font-size: 12px; letter-spacing: .04em; color: var(--muted); }
  .stat dd { font-size: 24px; font-weight: 500; margin-top: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .panel2 { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); padding: 16px 18px; }
  .panel2 h3 { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
  table.ev { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.ev th { text-align: left; font-weight: 400; color: var(--muted); font-size: 12px;
    padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.ev td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.6; }
  table.ev tr:last-child td { border-bottom: none; }
  .q { max-width: 34ch; }
  .why { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .sample { font-size: 13px; line-height: 1.6; }
  .sample li { list-style: none; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .sample li:last-child { border-bottom: none; }
  .sample .meta { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px;
    border: 1px solid var(--line); }
  .pill.ok { color: #0d7a63; border-color: #0d7a63; }
  .pill.bad { color: #b4453a; border-color: #b4453a; }
  .empty2 { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .grow { flex: 1; }
</style>
</head>
<body>

<div class="app is-shell">
    <aside class="sb">
    <div class="sb-brand">
      <span class="sb-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"></circle><path d="M12 3.4v17.2M3.4 12h17.2"></path></svg>
      </span>
      <span class="sb-name">
        <b>Socratic Mind</b>
        <small>内部后台</small>
      </span>
    </div>

    <nav class="sb-nav">
      <p class="sb-label">运营</p>
      <a class="sb-item" href="./index.html">
        <svg viewBox="0 0 16 16"><path d="M3 3.6h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7.2L4.4 13.6v-2H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"></path></svg>
        会话
      </a>
      <a class="sb-item" href="./review.html" data-perm="review">
        <svg viewBox="0 0 16 16"><path d="M3 8.4 6.2 11.6 13 4.8"></path></svg>
        审核
      </a>
      <a class="sb-item" href="./accounts.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="5.7" r="2.4"></circle><path d="M3.4 13.2c.6-2.5 2.4-3.7 4.6-3.7s4 1.2 4.6 3.7"></path></svg>
        账号
      </a>
      <a class="sb-item" href="./members.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><circle cx="5.6" cy="5.9" r="2.1"></circle><path d="M2.4 13c.5-2.2 1.9-3.3 3.9-3.3s3.4 1.1 3.9 3.3"></path><circle cx="11.2" cy="6.6" r="1.6"></circle><path d="M10.4 12.6c.3-1.7 1.2-2.5 2.5-2.5.9 0 1.5.4 1.9 1.2"></path></svg>
        成员
      </a>
      <a class="sb-item" href="./login.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><path d="M9.2 3.6H4.6a1 1 0 0 0-1 1v6.8a1 1 0 0 0 1 1h4.6"></path><path d="M11 5.9 13 8l-2 2.1M6.4 8h6.4"></path></svg>
        登录
      </a>

      <p class="sb-label">配置</p>
      <a class="sb-item" href="./flow.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><circle cx="4" cy="4" r="1.6"></circle><circle cx="12" cy="6.2" r="1.6"></circle><circle cx="7" cy="12" r="1.6"></circle><path d="M5.5 4.4 10.5 5.6M4.6 5.5l1.9 5"></path></svg>
        流程画布
      </a>
      <a class="sb-item" href="./policy.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M8 2.5 12.8 4.4v3.9c0 3-1.9 4.6-4.8 5.4-2.9-.8-4.8-2.4-4.8-5.4V4.4Z"></path></svg>
        输出策略
      </a>
      <a class="sb-item" href="./settings.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M2.6 5.2h2.2M8.2 5.2h5.2M2.6 10.8h5.2M11.2 10.8h2.2"></path><circle cx="6.6" cy="5.2" r="1.5"></circle><circle cx="9.6" cy="10.8" r="1.5"></circle></svg>
        规则与参数
      </a>
      <a class="sb-item" href="./lexicon.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M3.2 3.6h3.9a1 1 0 0 1 1 1v8H4.2a1 1 0 0 1-1-1Z"></path><path d="M12.8 3.6H8.9a1 1 0 0 0-1 1v8h3.9a1 1 0 0 0 1-1Z"></path></svg>
        词库
      </a>
      <a class="sb-item" href="./ai.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.2"></rect><path d="M6.6 2.4v2.2M9.4 2.4v2.2M6.6 11.4v2.2M9.4 11.4v2.2M2.4 6.6h2.2M2.4 9.4h2.2M11.4 6.6h2.2M11.4 9.4h2.2"></path></svg>
        模型
      </a>
      <a class="sb-item" href="./knowledge.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M8 2.8 13 5.2 8 7.6 3 5.2Z"></path><path d="M3 8.6 8 11l5-2.4"></path></svg>
        知识库
      </a>
      <a class="sb-item is-on" href="./eval.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M3.2 11.4a5 5 0 1 1 9.6 0"></path><path d="M8 11.4 10.4 7.6"></path></svg>
        评测
      </a>
      <div class="sb-sub" data-perm="ops">
        <a class="sb-sub-item is-on" href="#metrics" data-sub="metrics">指标总览</a>
        <a class="sb-sub-item" href="#reviews" data-sub="reviews">待复核样本</a>
        <a class="sb-sub-item" href="#sample" data-sub="sample">确定性抽样</a>
      </div>
    </nav>
    <div class="sb-foot">
    </div>
  </aside>

  <header class="topbar">
    <div class="crumb">
      <span>内部后台</span>
      <i>/</i>
      <b>评测</b>
      <em class="crumb-note">只看这一周发生了什么 · 不合成总分</em>
    </div>
    <div class="top-actions">
        <select class="btn" id="days">
        <option value="1">近 1 天</option>
        <option value="7" selected>近 7 天</option>
        <option value="30">近 30 天</option>
      </select>
        <button class="btn" id="refreshBtn" type="button">刷新</button>
    </div>
  </header>

  <main class="eval-wrap">
    <div class="subnav">
      <div class="tabs" role="tablist" aria-label="评测分类">
        <button class="tab is-on" type="button" role="tab" data-sub="metrics" aria-selected="true">指标总览</button>
        <button class="tab" type="button" role="tab" data-sub="reviews" aria-selected="false">待复核样本</button>
        <button class="tab" type="button" role="tab" data-sub="sample" aria-selected="false">确定性抽样</button>
      </div>
    </div>

    <div data-subpane="metrics">
    <div class="eval-head">
      <h2>回答率、拒答率、引用有效率分开看</h2>
      <p>
        合成一个总分只会让人以为系统在变好，看不出是哪一段在变差。
        下面四格分别对应：能不能答、该不该拒、引用站不站得住、还有多少样本没人看。
        拒答不等于错误——它进待复核池，是因为要么语料缺了，要么改写没覆盖这种问法，要么门槛太紧。
      </p>
    </div>

    <dl class="stats" id="stats"></dl>
    </div>

      <section class="panel2" data-subpane="reviews" hidden>
        <div class="toolbar">
          <h3 style="margin:0">待复核样本</h3>
          <span class="grow"></span>
          <label class="why" style="display:flex;gap:6px;align-items:center">
            <input type="checkbox" id="showResolved"> 含已处理
          </label>
        </div>
        <div id="badcases"></div>
      </section>

      <section class="panel2" data-subpane="sample" hidden>
        <h3>确定性抽样（按步长取，不是随机）</h3>
        <ol class="sample" id="sample"></ol>
      </section>
  </main>
</div>

<script src="./auth.js"></script>
<script src="./eval.js"></script>
<script src="../shared/subnav.js"></script>
</body>
</html>
