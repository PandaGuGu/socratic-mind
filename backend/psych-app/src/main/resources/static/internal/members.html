<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socratic Mind · 成员与职责</title>
<link rel="stylesheet" href="./app.css">
<style>
  .profile-wrap {
    min-height: 0;
    overflow-y: auto;
    padding: 26px 28px 44px;
  }
  .profile-card {
    max-width: 620px;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    background: var(--surface);
    padding: 20px 22px 18px;
  }
  .profile-card + .profile-card { margin-top: 16px; }
  .profile-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .profile-card p.hint { font-size: 11.5px; color: var(--muted); line-height: 1.8; margin-bottom: 14px; }
  .who {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--line-soft);
  }
  .who-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #f0ece4, #e2ddd2);
    border: 1px solid #e4e1d9;
    font-size: 20px;
    font-weight: 600;
    color: #4a514d;
    flex: none;
  }
  .who-avatar svg { width: 24px; height: 24px; fill: none; stroke: #6d706a; stroke-width: 1.3; }
  .who-name { font-size: 15px; font-weight: 600; }
  .who-meta { margin-top: 3px; font-size: 11.5px; color: var(--muted); }
  .kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; font-size: 12px; }
  .kv dt { color: var(--muted); }
  .kv dd { color: var(--ink-soft); }
  .form-row { margin-bottom: 12px; }
  .form-row label { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 5px; }
  .form-row input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface-2);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
  }
  .form-row input:focus { outline: none; border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--accent-soft); }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .msg { font-size: 11.5px; min-height: 17px; }
  .msg.ok { color: var(--accent-deep); }
  .msg.bad { color: var(--refer); }
  .token-note {
    padding: 10px 12px;
    border: 1px dashed var(--line);
    border-radius: var(--r-sm);
    background: var(--surface-2);
    font-size: 11.5px;
    line-height: 1.8;
    color: var(--muted);
  }
  .tbl-wrap { background: var(--surface); }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px;
    padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2, #faf9f6); }
  .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl .empty { color: var(--muted); text-align: center; padding: 18px; }
  .role-tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); color: var(--ink-2, #444); }
  .role-tag.admin { border-color: #c9a227; color: #8a6d12; background: #fdf7e3; }
  .role-tag.reviewer { border-color: #7aa7c7; color: #2f5f7f; background: #eef5fa; }
  .role-tag.operator { border-color: #8fbf9a; color: #37693f; background: #eef7f0; }
  .role-tag.viewer { color: var(--muted); }
  .is-off { color: var(--muted); }
  .row-act { display: flex; gap: 8px; justify-content: flex-end; }
  .link-act { border: none; background: none; padding: 0; cursor: pointer; font-size: 11.5px;
    color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .link-act:hover { color: var(--ink); }
  .link-act.danger:hover { color: #b04a3a; }
</style>
</head>
<body>

<div class="app is-shell">

  <aside class="sb">
    <div class="sb-brand">
      <span class="sb-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"></circle><path d="M12 3.4v17.2M3.4 12h17.2"></path></svg>
      </span>
      <span class="sb-name"><b>Socratic Mind</b><small>内部后台</small></span>
    </div>

    <nav class="sb-nav">
      <p class="sb-label">运营</p>
      <a class="sb-item" href="./index.html">
        <svg viewBox="0 0 16 16"><path d="M3 3.6h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7.2L4.4 13.6v-2H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1Z"></path></svg>
        会话
      </a>
      <a class="sb-item" href="./review.html" data-perm="review">
        <svg viewBox="0 0 16 16"><path d="M3 8.4 6.2 11.6 13 4.8"></path></svg>
        审核
      </a>
      <a class="sb-item" href="./accounts.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="5.7" r="2.4"></circle><path d="M3.4 13.2c.6-2.5 2.4-3.7 4.6-3.7s4 1.2 4.6 3.7"></path></svg>
        账号
      </a>
      <a class="sb-item" href="./members.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><circle cx="5.6" cy="5.9" r="2.1"></circle><path d="M2.4 13c.5-2.2 1.9-3.3 3.9-3.3s3.4 1.1 3.9 3.3"></path><circle cx="11.2" cy="6.6" r="1.6"></circle><path d="M10.4 12.6c.3-1.7 1.2-2.5 2.5-2.5.9 0 1.5.4 1.9 1.2"></path></svg>
        成员
      </a>
      <div class="sb-sub" data-perm="manage">
        <a class="sb-sub-item is-on" href="#list" data-sub="list">成员列表</a>
        <a class="sb-sub-item" href="#create" data-sub="create">新增成员</a>
      </div>
      <a class="sb-item" href="./login.html" data-perm="manage">
        <svg viewBox="0 0 16 16"><path d="M9.2 3.6H4.6a1 1 0 0 0-1 1v6.8a1 1 0 0 0 1 1h4.6"></path><path d="M11 5.9 13 8l-2 2.1M6.4 8h6.4"></path></svg>
        登录
      </a>

      <p class="sb-label">配置</p>
      <a class="sb-item" href="./flow.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><circle cx="4" cy="4" r="1.6"></circle><circle cx="12" cy="6.2" r="1.6"></circle><circle cx="7" cy="12" r="1.6"></circle><path d="M5.5 4.4 10.5 5.6M4.6 5.5l1.9 5"></path></svg>
        流程画布
      </a>
      <a class="sb-item" href="./policy.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M8 2.5 12.8 4.4v3.9c0 3-1.9 4.6-4.8 5.4-2.9-.8-4.8-2.4-4.8-5.4V4.4Z"></path></svg>
        输出策略
      </a>
      <a class="sb-item" href="./settings.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M2.6 5.2h2.2M8.2 5.2h5.2M2.6 10.8h5.2M11.2 10.8h2.2"></path><circle cx="6.6" cy="5.2" r="1.5"></circle><circle cx="9.6" cy="10.8" r="1.5"></circle></svg>
        规则与参数
      </a>
      <a class="sb-item" href="./lexicon.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M3.2 3.6h3.9a1 1 0 0 1 1 1v8H4.2a1 1 0 0 1-1-1Z"></path><path d="M12.8 3.6H8.9a1 1 0 0 0-1 1v8h3.9a1 1 0 0 0 1-1Z"></path></svg>
        词库
      </a>
      <a class="sb-item" href="./ai.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><rect x="4.6" y="4.6" width="6.8" height="6.8" rx="1.2"></rect><path d="M6.6 2.4v2.2M9.4 2.4v2.2M6.6 11.4v2.2M9.4 11.4v2.2M2.4 6.6h2.2M2.4 9.4h2.2M11.4 6.6h2.2M11.4 9.4h2.2"></path></svg>
        模型
      </a>
      <a class="sb-item" href="./knowledge.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M8 2.8 13 5.2 8 7.6 3 5.2Z"></path><path d="M3 8.6 8 11l5-2.4"></path></svg>
        知识库
      </a>
      <a class="sb-item" href="./eval.html" data-perm="ops">
        <svg viewBox="0 0 16 16"><path d="M3.2 11.4a5 5 0 1 1 9.6 0"></path><path d="M8 11.4 10.4 7.6"></path></svg>
        评测
      </a>
    </nav>
  </aside>

  <header class="topbar">
    <div class="crumb">
      <span>内部后台</span>
      <i>/</i>
      <b>成员</b>
      <em class="crumb-note">谁在什么位置，能签什么字</em>
    </div>
    <div class="top-actions"></div>
  </header>

  <main class="profile-wrap">
    <div class="subnav">
      <div class="tabs" role="tablist" aria-label="成员分类">
        <button class="tab is-on" type="button" role="tab" data-sub="list" aria-selected="true">成员列表</button>
        <button class="tab" type="button" role="tab" data-sub="create" aria-selected="false">新增成员</button>
      </div>
    </div>

    <section class="profile-card" data-subpane="list">
      <h2>职责</h2>
      <p class="hint">
        三件事分开：<b>管理员</b>管人和口令；<b>运营</b>管资料入库、可见范围、词库、模型与运行参数；
        <b>审核</b>只做内容把关：知识发布与退回、安全提示确认。配置由运营统一维护。
        管理员对所有事放行，但代签时会留下管理员的名字。
      </p>
      <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:10px;overflow:hidden">
        <table class="tbl" id="memberTable">
          <thead>
            <tr><th>成员</th><th>职责</th><th>登录名</th><th>状态</th><th></th></tr>
          </thead>
          <tbody id="memberRows">
            <tr><td colspan="5" class="empty">正在读取…</td></tr>
          </tbody>
        </table>
      </div>
      <p class="hint" id="memberNote" style="margin-top:10px"></p>
    </section>

    <section class="profile-card" id="createCard" data-subpane="create" hidden>
      <h2>新增成员</h2>
      <p class="hint">口令由你设定、当面转交——这个系统没有发信通道，不会也不该替你发邀请邮件。</p>
      <form id="createForm" autocomplete="off">
        <div class="form-row">
          <label for="newName">姓名 / 称呼</label>
          <input id="newName" maxlength="64" placeholder="如：李医生" required>
        </div>
        <div class="form-row">
          <label for="newRole">职责</label>
          <select id="newRole">
            <option value="operator">运营 · 资料入库、词库、模型</option>
            <option value="reviewer">审核 · 知识发布与退回</option>
            <option value="admin">管理员 · 成员与全部权限</option>
            <option value="viewer">只读 · 看得到，改不了</option>
          </select>
        </div>
        <div class="form-row">
          <label for="newUsername">登录名</label>
          <input id="newUsername" maxlength="64" placeholder="字母或数字，3–64 位" required>
        </div>
        <div class="form-row">
          <label for="newPassword">初始口令</label>
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit" id="createBtn">创建成员</button>
          <span class="msg" id="createMsg" role="status"></span>
        </div>
      </form>
    </section>
  </main>
</div>

<script src="./auth.js"></script>
<script src="./members.js"></script>
<script src="../shared/subnav.js"></script>
</body>
</html>
