# 切到 PostgreSQL + pgvector：--spring.profiles.active=pg
# 前置：docker compose -f deploy/docker-compose.yml up -d
psych:
  store: postgres
  db:
    enabled: true
    url: ${PSYCH_DB_URL:jdbc:postgresql://localhost:5432/psych}
    username: ${PSYCH_DB_USER:psych}
    password: ${PSYCH_DB_PASSWORD:psych_local_dev}
  # 会话域落库：与知识库共用同一个数据源，但开关独立（可只持久化会话）
  session:
    store: jdbc
  # 本地 compose 档默认打开控制台；上生产请关掉或换令牌
  internal:
    enabled: true
    token: ${PSYCH_INTERNAL_TOKEN:dev-internal-token}
    # 本机验收：自动填入上面的令牌，不再弹窗。容器/公网档设成 false。
    dev-hint: ${PSYCH_INTERNAL_DEV_HINT:true}
