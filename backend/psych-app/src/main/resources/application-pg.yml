# 切到 PostgreSQL + pgvector：--spring.profiles.active=pg
# 前置：docker compose -f deploy/docker-compose.yml up -d
psych:
  # 本地语音转写：本机 jar 默认指向 Windows 语音脚本；
  # 容器 compose 用空的 PSYCH_ASR_COMMAND 覆盖，接口回 503，页面提示直接打字。
  asr:
    command: ${PSYCH_ASR_COMMAND:powershell -NoProfile -ExecutionPolicy Bypass -File ../scripts/asr_transcribe.ps1 -Path {file} -Result {result}}
  # 模型：本地 Ollama（对话 qwen3-8b、向量 bge-m3）。没有 Ollama 时用 --spring.profiles.active=pg,stub
  ai:
    provider: http
    base-url: ${PSYCH_AI_BASE_URL:http://localhost:11434/v1}
    api-key: ${PSYCH_AI_API_KEY:ollama}
    chat-model: ${PSYCH_AI_CHAT_MODEL:qwen3-8b}
    embedding-model: ${PSYCH_AI_EMBEDDING_MODEL:bge-m3}
    embedding-dimension: ${PSYCH_AI_EMBEDDING_DIMENSION:1024}
    temperature: ${PSYCH_AI_TEMPERATURE:0.2}
    no-think: true
  # 组织模式与审核留痕落库：多实例共享
  org:
    enabled: ${PSYCH_ORG_ENABLED:true}
    store: jdbc
  review:
    store: jdbc
  rate-limit:
    store: jdbc
  store: postgres
  # 评测留痕落库：线上要看 7 天窗口，内存档撑不住重启
  eval:
    store: jdbc
  db:
    enabled: true
    url: ${PSYCH_DB_URL:jdbc:postgresql://localhost:5432/psych}
    username: ${PSYCH_DB_USER:psych}
    password: ${PSYCH_DB_PASSWORD:psych_local_dev}
    # 连接池：并发压测前先定上限，默认 20；PG 的 max_connections 要留出运维余量
    pool:
      max: ${PSYCH_DB_POOL_MAX:20}
      min-idle: ${PSYCH_DB_POOL_MIN_IDLE:2}
      connection-timeout-ms: ${PSYCH_DB_POOL_TIMEOUT_MS:5000}
  # 会话域落库：与知识库共用同一个数据源，但开关独立（可只持久化会话）
  session:
    store: jdbc
  # 本地 compose 档默认打开控制台；上生产请关掉或换令牌
  internal:
    enabled: true
    token: ${PSYCH_INTERNAL_TOKEN:dev-internal-token}
    # 本机验收：自动填入上面的令牌，不再弹窗。容器/公网档设成 false。
    dev-hint: ${PSYCH_INTERNAL_DEV_HINT:true}
